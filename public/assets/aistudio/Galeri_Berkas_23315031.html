<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeri Berkas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#efefef;--card:#fff;--ink:#0d0d0d;--mute:#7a7a7a;--pill:#f1f1f1;--ring:rgba(255,255,255,.9);--sh:0 6px 24px rgba(0,0,0,.07);--btn:#0d0d0d;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}
nav{display:flex;align-items:center;justify-content:space-between;padding:26px 0;font-weight:500;font-size:15px}
nav .logo{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:26px;font-weight:600;letter-spacing:-.02em}
nav a{color:inherit;text-decoration:none}
.menu{background:var(--card);border:0;border-radius:999px;padding:10px 18px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--sh)}
.hero{text-align:center;padding:64px 0 14px}
.pill{display:inline-block;background:var(--card);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500}
h1{font-size:clamp(36px,7vw,72px);line-height:1;letter-spacing:-.05em;margin:0 0 6px;font-weight:800}
h1 i{font-family:Georgia,serif;font-weight:400}
.sub{color:var(--mute);font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--mute);font:inherit;font-size:15px;font-weight:500;padding:10px 18px;border-radius:999px;cursor:pointer}
.tab span{margin-left:6px;opacity:.7}
.tab.on{background:var(--btn);color:var(--btnt)}
.add{border:0;background:var(--card);color:inherit;font:inherit;font-weight:500;padding:11px 20px;border-radius:999px;cursor:pointer;box-shadow:var(--sh)}
.tile{background:var(--card);border-radius:28px;padding:6px;box-shadow:var(--sh),0 0 0 4px var(--ring);overflow:hidden}
.thumb{position:relative;border-radius:22px;overflow:hidden;display:grid;place-items:center;aspect-ratio:4/3}
.thumb svg{width:44px;height:44px;opacity:.9}
.tag{position:absolute;top:12px;right:12px;background:var(--card);color:var(--ink);font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px}
.feat{display:grid;grid-template-columns:1.05fr 1fr;margin-bottom:22px}
.feat .thumb{aspect-ratio:auto;min-height:380px}
.feat .body{padding:34px 34px 28px;display:flex;flex-direction:column}
.feat .tag{position:static;align-self:flex-start;background:var(--pill)}
.feat h2{font-size:clamp(24px,3.4vw,36px);line-height:1.1;letter-spacing:-.035em;margin:24px 0 14px;font-weight:600;word-break:break-word}
.feat p{color:var(--mute);font-size:17px;line-height:1.5;max-width:40ch}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:24px;font-size:13px;font-weight:500}
.foot em{font-family:Georgia,serif;font-size:20px}
.dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card .body{padding:20px 16px 16px}
.card h3{font-size:17px;line-height:1.3;font-weight:500;letter-spacing:-.02em;word-break:break-word}
.card p{color:var(--mute);font-size:15px;margin-top:8px}
.card{cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
@media(max-width:860px){.feat{grid-template-columns:1fr}.feat .thumb{min-height:240px}.grid{grid-template-columns:repeat(2,1fr)}.nav-links{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.feat .body{padding:24px 18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1>GALERI BERKAS</h1>
</header>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <button class="add">+ Tambah File</button>
</div>

<main id="out"></main>
</div>

<script>
// Tambahkan thumbnail asli lewat field "src" (mis. src:"foto.jpg"); tanpa src dipakai warna pengganti.
var FILES=[
{n:"FEED POST OLIMPIADE copy.jpg",s:"1.0 MB",t:"Gambar",c:["#14502e","#0a2a1a"]},
{n:"Screenshot 2026-10-17 080003.png",s:"1.2 MB",t:"Gambar",c:["#1f6b3f","#103a24"]},
{n:"Poster Pakai Masker.png",s:"0.9 MB",t:"Gambar",c:["#2b6fa8","#143a5e"]},
{n:"Dokumentasi Lomba Perkantoran 01.jpg",s:"2.1 MB",t:"Gambar",c:["#6b5b3a","#2e2616"]},
{n:"Dokumentasi Lomba Perkantoran 02.jpg",s:"1.8 MB",t:"Gambar",c:["#4a5a6a","#1d2630"]},
{n:"Kegiatan Porsenik.mp4",s:"84 MB",t:"Video",c:["#5a3a6b","#241630"]},
{n:"Foto Tim Panitia.jpg",s:"1.4 MB",t:"Gambar",c:["#7a4a2a","#331c0e"]},
{n:"Banner Olimpiade.png",s:"1.1 MB",t:"Gambar",c:["#1d5a5a","#0c2a2a"]},
{n:"Suasana Pembukaan.jpg",s:"2.4 MB",t:"Gambar",c:["#5a6b2a","#262e0e"]}
];
var f="Semua",tabs=["Semua","Gambar","Video","Dokumen"],cnt={Semua:120,Gambar:119,Video:1,Dokumen:0};
var ic='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>';
var vi='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function thumb(x,cls){
  var inner=x.src?'<img src="'+esc(x.src)+'" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">':(x.t=="Video"?vi:ic);
  return '<div class="thumb" style="background:linear-gradient(145deg,'+x.c[0]+','+x.c[1]+')">'+inner+(cls?'':'<span class="tag">'+x.t+'</span>')+'</div>';
}
function render(){
  var list=FILES.filter(function(x){return f=="Semua"||x.t==f});
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button class="tab'+(t==f?' on':'')+'" data-t="'+t+'">'+t+'<span>'+cnt[t]+'</span></button>'}).join("");
  var o=document.getElementById("out");
  if(!list.length){o.innerHTML='<div class="empty">Belum ada '+f.toLowerCase()+'. Klik “Tambah File” untuk mengunggah.</div>';return}
  var a=list[0],h='<article class="tile feat">'+thumb(a,1)+'<div class="body"><span class="tag">'+a.t+'</span><h2>'+esc(a.n)+'</h2><p>File terbaru di galeri proyek. Klik untuk melihat, mengunduh, atau menambahkannya ke laporan.</p><div class="foot"><span class="dot">'+a.s+'</span><em>Berkas terbaru</em></div></div></article>';
  h+='<section class="grid">'+list.slice(1).map(function(x){return '<article class="tile card">'+thumb(x)+'<div class="body"><h3>'+esc(x.n)+'</h3><p>'+x.s+' • '+x.t+'</p></div></article>'}).join("")+'</section>';
  o.innerHTML=h;
}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(b){f=b.dataset.t;render()}});
render();
</script>
</body>
</html>
