<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaporanWee — Crop Foto Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- ═════════ 1. DESIGN — semua class berawalan "pc-" supaya aman ditempel ke project lain ═════════ -->
<style id="pc-design">
:root{
  --pc-ink:#1f1d2b;--pc-muted:#7d7a8c;--pc-surface:rgba(255,255,255,.96);--pc-glass:rgba(255,255,255,.7);--pc-line:rgba(31,29,43,.1);
  --pc-dark:#23212e;--pc-on-dark:#fff;--pc-lime:#d4ee6b;--pc-lav:#d9d3f5;--pc-accent:#7a69d0;--pc-scrim:rgba(30,26,50,.38);
  --pc-ease:cubic-bezier(.22,1,.36,1);--pc-spring:cubic-bezier(.34,1.56,.64,1);--pc-stage:min(280px,62vw);
}
[data-theme=dark]{
  --pc-ink:#f2f0fa;--pc-muted:#9a97ad;--pc-surface:rgba(40,38,56,.96);--pc-glass:rgba(60,57,82,.7);--pc-line:rgba(255,255,255,.12);
  --pc-dark:#f2f0fa;--pc-on-dark:#1f1d2b;--pc-lav:#3b3560;--pc-accent:#a99bf0;--pc-scrim:rgba(8,6,16,.6);
}
/* Overlay dikunci ke viewport. PENTING: render elemen ini langsung di <body> (di React: createPortal ke document.body).
   Jika berada di dalam elemen yang punya transform / filter / backdrop-filter / animasi, position:fixed akan
   mengikuti elemen itu — itulah penyebab modal "tidak muncul" walau layar sudah gelap. */
.pc-ov{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:16px;background:var(--pc-scrim);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pc-ink);
  visibility:hidden;opacity:0;pointer-events:none}
.pc-ov.pc-show{visibility:visible;opacity:1;pointer-events:auto}
.pc-ov *{box-sizing:border-box}
.pc-modal{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;padding:26px 28px 28px;border-radius:36px;
  background:var(--pc-surface);border:1px solid var(--pc-line);box-shadow:0 40px 90px -30px rgba(0,0,0,.55)}
.pc-grab{display:none;width:44px;height:5px;border-radius:9px;background:var(--pc-line);margin:0 auto 14px}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pc-head h2{font-size:23px;font-weight:600;letter-spacing:-.02em}
.pc-hint-t{color:var(--pc-muted);font-size:14px;line-height:1.5;margin:6px 0 18px}
.pc-x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pc-glass);border:0;color:inherit;cursor:pointer;flex:none}
.pc-x svg,.pc-b svg,.pc-pad svg,.pc-tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc-main{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px}
.pc-stage{position:relative;width:var(--pc-stage);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--pc-line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 0 0 6px var(--pc-glass),0 28px 50px -24px rgba(60,50,110,.7);outline-offset:9px;isolation:isolate}
.pc-stage.pc-drag{cursor:grabbing}
.pc-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;-webkit-user-drag:none;user-select:none;will-change:transform}
.pc-ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8);pointer-events:none;z-index:2}
.pc-grid{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.6) 33% calc(33% + 1px),transparent calc(33% + 1px) 66%,rgba(255,255,255,.6) 66% calc(66% + 1px),transparent calc(66% + 1px)),
  linear-gradient(transparent 33%,rgba(255,255,255,.6) 33% calc(33% + 1px),transparent calc(33% + 1px) 66%,rgba(255,255,255,.6) 66% calc(66% + 1px),transparent calc(66% + 1px))}
.pc-stage.pc-act .pc-grid{opacity:1}
.pc-tip{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:3;padding:6px 13px;border-radius:999px;background:rgba(20,18,30,.62);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(6px)}
.pc-stage.pc-touched .pc-tip{opacity:0;transform:translate(-50%,6px)}
.pc-dropmsg{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:30px;font-weight:500;font-size:15px;color:#fff;background:rgba(122,105,208,.72);opacity:0;pointer-events:none;backdrop-filter:blur(4px)}
.pc-stage.pc-over .pc-dropmsg{opacity:1}
.pc-prevs{display:flex;flex-direction:column;align-items:center;gap:12px}.pc-prevs small{font-size:11px;color:var(--pc-muted)}
.pc-pv{position:relative;overflow:hidden;border-radius:50%;background:var(--pc-line);box-shadow:0 0 0 3px var(--pc-glass)}
.pc-pv img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
.pc-pv.l{width:72px;height:72px}.pc-pv.m{width:44px;height:44px}.pc-pv.s{width:28px;height:28px}
.pc-panels{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-bottom:18px}
.pc-panel{padding:16px 18px;border-radius:24px;background:var(--pc-glass);border:1px solid var(--pc-line)}
.pc-panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--pc-muted);margin-bottom:12px}
.pc-dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:6px;justify-content:center}
.pc-pad{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pc-surface);border:1px solid var(--pc-line);color:inherit;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pc-pad[data-d=up]{grid-area:1/2}.pc-pad[data-d=left]{grid-area:2/1}.pc-pad[data-d=center]{grid-area:2/2;background:var(--pc-dark);color:var(--pc-on-dark);border-color:transparent}
.pc-pad[data-d=right]{grid-area:2/3}.pc-pad[data-d=down]{grid-area:3/2}
.pc-pad.pc-lim{opacity:.35}
.pc-read{margin-top:12px;text-align:center;font-size:12.5px;color:var(--pc-muted);font-variant-numeric:tabular-nums}
.pc-zoom{display:grid;grid-template-columns:40px 1fr 40px 48px;align-items:center;gap:10px;margin-bottom:16px}
.pc-zoom output{font-size:12.5px;color:var(--pc-muted);text-align:right;font-variant-numeric:tabular-nums}
.pc-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pc-surface);border:1px solid var(--pc-line);color:inherit;cursor:pointer}
.pc-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.pc-ico[disabled]{opacity:.35;pointer-events:none}
.pc-range{appearance:none;-webkit-appearance:none;width:100%;height:6px;border-radius:9px;background:var(--pc-line);outline:0}
.pc-range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--pc-dark);border:3px solid var(--pc-surface);box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:grab}
.pc-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--pc-dark);border:3px solid var(--pc-surface)}
.pc-tools{display:flex;gap:8px;flex-wrap:wrap}
.pc-tool{height:42px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;background:var(--pc-surface);border:1px solid var(--pc-line);font:inherit;font-size:13.5px;font-weight:500;color:inherit;cursor:pointer}
.pc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc-actions .pc-full{grid-column:1/-1}
.pc-b{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 22px;border-radius:999px;font:inherit;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;cursor:pointer;border:0;color:inherit;width:100%}
.pc-b.dark{background:var(--pc-dark);color:var(--pc-on-dark);box-shadow:0 16px 28px -14px rgba(35,33,46,.7)}
.pc-b.soft{background:var(--pc-glass);border:1px solid var(--pc-line)}
.pc-b .pc-spn{position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid transparent;border-top-color:currentColor;opacity:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(.pc-ov) :focus-visible{outline:2px solid var(--pc-accent);outline-offset:3px}
@media(max-width:640px){
  .pc-ov{place-items:end center;padding:0}
  .pc-modal{width:100%;max-height:94dvh;border-radius:34px 34px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom))}
  .pc-grab{display:block}.pc-main{flex-direction:column;gap:14px}.pc-prevs{flex-direction:row}
  .pc-panels{grid-template-columns:1fr}
}
</style>

<!-- ═════════ 2. MOTION — semua gerak & transisi dipisah di sini ═════════ -->
<style id="pc-motion">
.pc-ov{transition:opacity .4s var(--pc-ease),visibility 0s linear .4s}
.pc-ov.pc-show{transition:opacity .4s var(--pc-ease),visibility 0s}
.pc-modal{transform:translateY(34px) scale(.94);opacity:0;transition:transform .7s var(--pc-spring),opacity .45s var(--pc-ease)}
.pc-show .pc-modal{transform:none;opacity:1}
/* isi modal masuk bertahap */
.pc-show .pc-head,.pc-show .pc-hint-t,.pc-show .pc-main,.pc-show .pc-panel,.pc-show .pc-actions{animation:pc-rise .75s var(--pc-ease) both}
.pc-show .pc-hint-t{animation-delay:.05s}.pc-show .pc-main{animation-delay:.1s}.pc-show .pc-panel:nth-child(1){animation-delay:.18s}
.pc-show .pc-panel:nth-child(2){animation-delay:.24s}.pc-show .pc-actions{animation-delay:.3s}
@keyframes pc-rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.pc-show .pc-stage{animation:pc-stage-in .9s var(--pc-spring) .12s both}
@keyframes pc-stage-in{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
.pc-x{transition:transform .5s var(--pc-spring),background .3s}.pc-x:hover{transform:rotate(90deg)}
.pc-stage{transition:box-shadow .4s var(--pc-ease)}
.pc-stage.pc-drag{box-shadow:0 0 0 6px var(--pc-lav),0 34px 56px -22px rgba(60,50,110,.8)}
.pc-grid,.pc-tip,.pc-dropmsg{transition:opacity .35s var(--pc-ease),transform .45s var(--pc-ease)}
.pc-tip{animation:pc-bob 2.6s ease-in-out infinite}@keyframes pc-bob{50%{margin-bottom:5px}}
.pc-stage.pc-over{box-shadow:0 0 0 6px var(--pc-accent),0 28px 50px -24px rgba(60,50,110,.7)}
/* gerak halus untuk perubahan lewat tombol (bukan saat drag) */
.pc-smooth,.pc-smooth img{transition:transform .32s var(--pc-ease)}
.pc-pad,.pc-ico,.pc-tool,.pc-b{transition:transform .35s var(--pc-spring),background .3s,opacity .3s,box-shadow .35s var(--pc-ease)}
.pc-pad:not(.pc-lim):hover,.pc-ico:hover,.pc-tool:hover{transform:translateY(-2px);background:var(--pc-lime);color:#23250a}
.pc-pad[data-d=center]:not(.pc-lim):hover{background:var(--pc-dark);color:var(--pc-on-dark);transform:scale(1.08) rotate(90deg)}
.pc-pad:active,.pc-ico:active,.pc-tool:active,.pc-b:active{transform:scale(.92)}
.pc-pad.pc-hold{transform:scale(.9);background:var(--pc-lime);color:#23250a}
.pc-pad.pc-hold svg{animation:pc-nudge .5s ease-in-out infinite alternate}
@keyframes pc-nudge{to{transform:translate(var(--pc-nx,0),var(--pc-ny,0))}}
.pc-pad[data-d=up]{--pc-ny:-3px}.pc-pad[data-d=down]{--pc-ny:3px}.pc-pad[data-d=left]{--pc-nx:-3px}.pc-pad[data-d=right]{--pc-nx:3px}
.pc-b:hover{transform:translateY(-2px)}.pc-b.dark:hover{box-shadow:0 22px 32px -14px rgba(35,33,46,.75)}
.pc-b.pc-load{pointer-events:none}.pc-b.pc-load>*:not(.pc-spn){opacity:0}.pc-b.pc-load .pc-spn{opacity:1;animation:pc-spin .8s linear infinite}
@keyframes pc-spin{to{transform:rotate(360deg)}}
.pc-read b{display:inline-block;transition:color .3s}
@media(prefers-reduced-motion:reduce){.pc-ov *,.pc-ov{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<!-- Latar halaman (hanya agar scrim terlihat wajar) — boleh dihapus saat dipindah ke project -->
<style id="pc-page">
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden;
  background:radial-gradient(800px 560px at 0% 100%,rgba(176,160,240,.5),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(244,214,170,.6),transparent 60%),linear-gradient(135deg,#e6e5ec,#f1f0f5);background-attachment:fixed}
[data-theme=dark] body{background:radial-gradient(800px 560px at 0% 100%,rgba(110,90,200,.4),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(200,140,80,.2),transparent 60%),linear-gradient(135deg,#14131b,#1b1a24)}
/* tombol bantu: hanya muncul setelah editor ditutup, supaya bisa dibuka lagi. Hapus saat integrasi. */
.pc-reopen{position:fixed;left:50%;top:50%;transform:translate(-50%,-40%) scale(.9);opacity:0;pointer-events:none;height:50px;padding:0 24px;border-radius:999px;border:0;cursor:pointer;
  font:500 15px 'Outfit',system-ui,sans-serif;background:var(--pc-dark);color:var(--pc-on-dark);box-shadow:0 18px 32px -14px rgba(35,33,46,.7);
  transition:opacity .5s var(--pc-ease),transform .7s var(--pc-spring)}
.pc-reopen.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
</style>
</head>

<!-- ═════════ 3. HTML KOMPONEN CROP (taruh langsung di <body>) ═════════ -->
<div class="pc-ov" id="pc" inert aria-hidden="true">
  <div class="pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-title">
    <div class="pc-grab"></div>
    <div class="pc-head"><h2 id="pc-title">Edit Foto Profil</h2><button type="button" class="pc-x" data-pc-close aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

          <button type="button" class="pc-pad" data-d="left" aria-label="Geser foto ke kiri"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
          <button type="button" class="pc-pad" data-d="center" aria-label="Pusatkan foto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
          <button type="button" class="pc-pad" data-d="right" aria-label="Geser foto ke kanan"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>

<!-- ═════════ 4. LOGIKA CROP (vanilla, tanpa dependensi) ═════════ -->
<script>
/* API:  const cropper = createPhotoCropper({ onSave(dataUrl, info){...}, onError(msg){...} });
         cropper.open(srcUrl);  cropper.close();  */
function createPhotoCropper(opts){
  opts=opts||{};
  const $=(s,r)=>(r||document).querySelector(s), root=$('#pc'), stage=$('#pc-stage'), img=$('#pc-img');
  const pvBox=[...root.querySelectorAll('.pc-pv')], pvImg=pvBox.map(b=>$('img',b)), pads=[...root.querySelectorAll('.pc-pad')];
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MAXDIM=2048, STEP=34, HOLD_SPEED=3.4;
  let CS=280,nw=0,nh=0,base=1,z=1,px=0,py=0,vx=0,vy=0,src='',orig='',dragging=false,hold=null,raf=0,last=null,pinch=null,lastFocus=null,smoothT=0,touched=false;
  const ptrs=new Map();
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const lim=()=>({x:Math.min(0,CS-nw*base*z),y:Math.min(0,CS-nh*base*z)});
  const elastic=(v,lo,hi)=>v<lo?lo+(v-lo)*.35:v>hi?hi+(v-hi)*.35:v;     // karet saat melewati batas

  function draw(){
    const L=lim(),ex=elastic(px,L.x,0),ey=elastic(py,L.y,0),s=base*z;
    img.style.transform=`translate(${ex}px,${ey}px) scale(${s})`;
    pvBox.forEach((b,i)=>{const r=b.clientWidth/CS;pvImg[i].style.transform=`translate(${ex*r}px,${ey*r}px) scale(${s*r})`});
    const cx=clamp(px,L.x,0),cy=clamp(py,L.y,0),ox=-L.x,oy=-L.y;
    const X=ox>1?Math.round(-cx/ox*100):50,Y=oy>1?Math.round(-cy/oy*100):50;
    $('#pc-read').innerHTML=(ox>1||oy>1)?`Posisi <b>X ${X}%</b> · <b>Y ${Y}%</b>`:'Foto pas — perbesar zoom untuk menggeser';
    const lm={left:ox<=1||cx<=L.x+.5,right:ox<=1||cx>=-.5,up:oy<=1||cy<=L.y+.5,down:oy<=1||cy>=-.5};   // foto bergerak ke arah tombol
    pads.forEach(p=>{const d=p.dataset.d;p.classList.toggle('pc-lim',d!=='center'&&lm[d]);if(d!=='center')p.setAttribute('aria-disabled',lm[d])});
    $('#pc-zr').value=Math.round(z*100);$('#pc-zo').textContent=Math.round(z*100)+'%';$('#pc-zm').disabled=z<=1;$('#pc-zp').disabled=z>=3;
  }
  /* satu loop untuk: inersia, kembali dari batas (karet), dan tahan-tombol-arah */
  function loop(){raf=0;let on=dragging;const L=lim();
    if(hold){px=clamp(px+hold.x*HOLD_SPEED,L.x,0);py=clamp(py+hold.y*HOLD_SPEED,L.y,0);on=true;vx=vy=0}
    else if(!dragging){
      if(Math.abs(vx)>.15||Math.abs(vy)>.15){px+=vx;py+=vy;vx*=.93;vy*=.93;on=true}
      const tx=clamp(px,L.x,0),ty=clamp(py,L.y,0);
      if(Math.abs(tx-px)>.25||Math.abs(ty-py)>.25){px+=(tx-px)*.2;py+=(ty-py)*.2;vx*=.8;vy*=.8;on=true}else{px=tx;py=ty}
    }
    draw();if(on)raf=requestAnimationFrame(loop)}
  const kick=()=>{if(!raf)raf=requestAnimationFrame(loop)};
  const smooth=()=>{if(RM)return;stage.classList.add('pc-smooth');pvBox.forEach(b=>b.classList.add('pc-smooth'));clearTimeout(smoothT);smoothT=setTimeout(()=>{stage.classList.remove('pc-smooth');pvBox.forEach(b=>b.classList.remove('pc-smooth'))},340)};
  const flash=()=>{stage.classList.add('pc-act');if(!touched){touched=true;stage.classList.add('pc-touched')}clearTimeout(flash.t);flash.t=setTimeout(()=>stage.classList.remove('pc-act'),900)};
  const settle=()=>{const L=lim();px=clamp(px,L.x,0);py=clamp(py,L.y,0);vx=vy=0};
  function step(dx,dy){settle();const L=lim();px=clamp(px+dx,L.x,0);py=clamp(py+dy,L.y,0);smooth();draw();flash()}
  function setZ(v,anim){settle();const nz=clamp(v,1,3),cx=(CS/2-px)/(base*z),cy=(CS/2-py)/(base*z);z=nz;px=CS/2-cx*base*z;py=CS/2-cy*base*z;settle();if(anim)smooth();draw();flash()}

  function setImg(url){src=url;img.onload=()=>{nw=img.naturalWidth;nh=img.naturalHeight;CS=stage.clientWidth||280;base=CS/Math.min(nw,nh);z=1;px=(CS-nw*base)/2;py=(CS-nh*base)/2;vx=vy=0;
    pvImg.forEach(i=>{i.src=url;i.style.width=nw+'px';i.style.height=nh+'px'});img.style.width=nw+'px';img.style.height=nh+'px';draw()};img.src=url}

  /* seret / cubit */
  stage.addEventListener('pointerdown',e=>{if(e.button>0)return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){last={x:e.clientX,y:e.clientY,t:performance.now()};vx=vy=0;dragging=true;stage.classList.add('pc-drag')}
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z};dragging=false}flash();kick()});
  stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];setZ(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);return}
    if(ptrs.size===1&&last){const n=performance.now(),dx=e.clientX-last.x,dy=e.clientY-last.y,dt=Math.max(1,n-last.t);px+=dx;py+=dy;vx=dx/dt*16;vy=dy/dt*16;last={x:e.clientX,y:e.clientY,t:n};kick()}});
  const up=e=>{if(!ptrs.delete(e.pointerId))return;pinch=null;
    if(ptrs.size===0){dragging=false;last=null;stage.classList.remove('pc-drag');if(RM||Math.hypot(vx,vy)<1){vx=vy=0}kick()}
    else{const [a]=[...ptrs.values()];last={x:a.x,y:a.y,t:performance.now()};dragging=true}};
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',e=>{e.preventDefault();setZ(z*Math.exp(-e.deltaY*.0015))},{passive:false});
  stage.addEventListener('keydown',e=>{const s=e.shiftKey?STEP*2:STEP,m={ArrowLeft:[s,0],ArrowRight:[-s,0],ArrowUp:[0,s],ArrowDown:[0,-s]}[e.key];
    if(m){e.preventDefault();step(-m[0],-m[1])}else if(e.key==='+'||e.key==='='){setZ(z+.1,1)}else if(e.key==='-'){setZ(z-.1,1)}});

  /* tombol arah: klik = satu langkah halus, tahan = geser terus */
  const DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let hT=0,held=false,activePad=null;
  const stopHold=()=>{clearTimeout(hT);if(activePad){activePad.classList.remove('pc-hold');activePad=null}if(hold){hold=null;held=true;kick()}};
  pads.forEach(p=>{const d=p.dataset.d;
    p.addEventListener('pointerdown',e=>{if(d==='center')return;p.setPointerCapture(e.pointerId);held=false;activePad=p;settle();
      hT=setTimeout(()=>{if(!activePad)return;hold={x:DIR[d][0],y:DIR[d][1]};held=true;p.classList.add('pc-hold');flash();kick()},240)});
    p.addEventListener('click',e=>{if(d==='center'){const L=lim();px=(CS-nw*base*z)/2;py=(CS-nh*base*z)/2;settle();smooth();draw();flash();return}
      if(e.detail>0&&held){held=false;return}                    // klik dari tombol yang ditahan: abaikan
      step(DIR[d][0]*STEP,DIR[d][1]*STEP)})});
  addEventListener('pointerup',stopHold);addEventListener('pointercancel',stopHold);addEventListener('blur',stopHold);

  $('#pc-zr').addEventListener('input',e=>setZ(e.target.value/100));$('#pc-zp').onclick=()=>setZ(z+.2,1);$('#pc-zm').onclick=()=>setZ(z-.2,1);
  $('#pc-reset').onclick=()=>{setImg(orig);flash()};
  function bake(rot){const c=document.createElement('canvas'),g=c.getContext('2d');c.width=rot?nh:nw;c.height=rot?nw:nh;g.translate(c.width/2,c.height/2);
    if(rot)g.rotate(-Math.PI/2);else g.scale(-1,1);g.drawImage(img,-nw/2,-nh/2);setImg(c.toDataURL('image/jpeg',.95));
    if(!RM)stage.animate([{opacity:.55,filter:'blur(5px)'},{opacity:1,filter:'none'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'})}
  $('#pc-rot').onclick=()=>bake(true);$('#pc-flip').onclick=()=>bake(false);

  /* pilih / jatuhkan file (otomatis diperkecil bila > 2048px) */
  function readFile(f){if(!f)return;if(!f.type||!f.type.startsWith('image/')){opts.onError&&opts.onError('File harus berupa gambar');return}
    if(f.size>12*1048576){opts.onError&&opts.onError('Ukuran foto maksimal 12 MB');return}
    const r=new FileReader();r.onerror=()=>opts.onError&&opts.onError('Gagal membaca file');
    r.onload=()=>{const im=new Image();im.onload=()=>{let url=r.result;const m=Math.max(im.naturalWidth,im.naturalHeight);
        if(m>MAXDIM){const k=MAXDIM/m,c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',.92)}
        orig=url;setImg(url)};im.onerror=()=>opts.onError&&opts.onError('Gambar tidak dapat dibuka');im.src=r.result};r.readAsDataURL(f)}
  $('#pc-file').onchange=e=>{readFile(e.target.files[0]);e.target.value=''};
  ['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('pc-over')}));
  ['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('pc-over')}));
  stage.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));

  /* simpan: hasil 512×512 sesuai area crop */
  $('#pc-save').onclick=e=>{const b=e.currentTarget;if(!nw)return;settle();draw();const o=document.createElement('canvas');o.width=o.height=512;const g=o.getContext('2d'),k=512/CS;
    g.fillStyle='#fff';g.fillRect(0,0,512,512);g.drawImage(img,0,0,nw,nh,px*k,py*k,nw*base*z*k,nh*base*z*k);
    b.classList.add('pc-load');setTimeout(()=>{b.classList.remove('pc-load');const L=lim();
      opts.onSave&&opts.onSave(o.toDataURL('image/jpeg',.92),{zoom:z,x:L.x?-px/-L.x:.5,y:L.y?-py/-L.y:.5});close()},850)};

  /* buka / tutup + fokus */
  function open(url){lastFocus=document.activeElement;orig=url;touched=false;stage.classList.remove('pc-touched');root.inert=false;root.removeAttribute('aria-hidden');root.classList.add('pc-show');
    document.documentElement.style.overflow='hidden';setImg(url);setTimeout(()=>stage.focus({preventScroll:true}),180)}
  function close(){root.classList.remove('pc-show');root.inert=true;root.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';stopHold();
    lastFocus&&lastFocus.isConnected&&lastFocus.focus({preventScroll:true})}
  root.addEventListener('click',e=>{if(e.target===root||e.target.closest('[data-pc-close]'))close()});
  addEventListener('keydown',e=>{if(e.key==='Escape'&&root.classList.contains('pc-show'))close()});
  root.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=[...root.querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex="0"],label[for]')].filter(x=>x.offsetParent);
    if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}});
  addEventListener('resize',()=>{if(!nw||!root.classList.contains('pc-show'))return;const n=stage.clientWidth||CS,r=n/CS;if(r===1)return;px*=r;py*=r;CS=n;base=CS/Math.min(nw,nh);draw()});
  return {open,close};
}

/* ═════════ BOOTSTRAP: editor langsung tampil dengan motion masuk ═════════ */
(function(){
  const reopen=document.getElementById('pc-reopen');
  /* Tema default: terang. Untuk mode gelap, set document.documentElement.dataset.theme='dark' */
  document.documentElement.dataset.theme='light';

  function starter(){const c=document.createElement('canvas');c.width=c.height=640;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,640,640);
    gr.addColorStop(0,'#cfc6f4');gr.addColorStop(.55,'#e3ddfa');gr.addColorStop(1,'#d4ee6b');g.fillStyle=gr;g.fillRect(0,0,640,640);
    g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(470,150,190,0,7);g.fill();g.fillStyle='rgba(143,127,224,.4)';g.beginPath();g.arc(110,540,230,0,7);g.fill();
    g.fillStyle='#2a2440';g.font='500 250px Outfit,system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('R',320,350);return c.toDataURL()}

  let current=starter();
  const cropper=createPhotoCropper({
    onSave(url,info){current=url;document.dispatchEvent(new CustomEvent('pc:save',{detail:{dataUrl:url,info}}))},   // sambungkan ke backend di sini
    onError(m){console.warn(m)}
  });
  window.photoCropper={open:()=>cropper.open(current),close:cropper.close};

  /* tombol bantu muncul saat editor tertutup */
  const root=document.getElementById('pc');
  new MutationObserver(()=>reopen.classList.toggle('on',!root.classList.contains('pc-show'))).observe(root,{attributes:true,attributeFilter:['class']});
  reopen.onclick=()=>cropper.open(current);

  /* tampil otomatis setelah font siap, supaya animasi masuk terlihat utuh */
  const show=()=>{current=starter();requestAnimationFrame(()=>requestAnimationFrame(()=>cropper.open(current)))};
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(show);
})();
</script>
