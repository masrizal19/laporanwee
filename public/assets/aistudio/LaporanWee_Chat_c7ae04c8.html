<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaporanWee Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--page:#ebeaf1;--g1:#cdc2f4;--g2:#fbe6d2;--glass:rgba(255,255,255,.62);--card:#fff;--ink:#1f1f33;--mute:#8a88a0;--line:rgba(120,110,160,.16);--chip:rgba(120,110,160,.12);--in:#fff;--out:#d8f06e;--outink:#1f1f33;--dark:#22223a;--darkink:#fff;--blue:#2f8dff;--sel:rgba(120,100,200,.1);--acc:#7a63d8}
:root[data-theme="dark"]{--page:#15131e;--g1:#3b2f78;--g2:#4a3626;--glass:rgba(38,35,58,.62);--card:#2a2842;--ink:#f1f0fa;--mute:#9a98b3;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.08);--in:#34314c;--out:#cfe863;--dark:#d4ee6a;--darkink:#1f1f33;--sel:rgba(255,255,255,.07);--acc:#b9a9f0}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:radial-gradient(800px 560px at 0% 100%,var(--g1),transparent 65%),radial-gradient(800px 560px at 100% 0%,var(--g2),transparent 60%),var(--page);background-attachment:fixed;color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{width:100%;height:100%;display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;position:relative}
.side,.rail,.main{background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-radius:28px;border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 40px -16px rgba(90,70,170,.3)}
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.lg{width:42px;height:42px;border-radius:13px;background:#22223a;color:#c9b8ff;font-weight:700;display:grid;place-items:center;margin-bottom:12px;font-size:14px}
.rail button{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--mute);transition:.2s}
.rail button:hover{background:var(--sel);color:var(--ink)}
.rail button.on{background:var(--dark);color:var(--darkink);box-shadow:0 8px 18px -6px rgba(34,34,58,.5)}
.rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .sp{flex:1}
.tg{display:flex;background:var(--chip);border-radius:99px;padding:3px}
.tg button{width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:14px;transition:.25s}
.tg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.14)}
.top{padding:16px 16px 12px;display:flex;align-items:center;gap:10px}
.top b{font-size:17px;flex:1}
.ib{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:15px;flex:none;transition:transform .2s}
.ib:hover{transform:scale(1.1)}
.search{margin:0 16px 12px;background:var(--chip);border-radius:12px;padding:10px 14px;display:flex;gap:8px;color:var(--mute)}
.search input{border:0;background:none;outline:0;color:var(--ink);font:inherit;font-size:14px;width:100%}
.tabs{margin:0 16px 8px;background:var(--chip);border-radius:99px;padding:4px;display:flex}
.tabs button{flex:1;padding:7px;border-radius:99px;font-size:13px;color:var(--mute);transition:.25s}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.list{flex:1;overflow:auto;padding:4px 8px}
.row{display:flex;gap:11px;padding:10px;border-radius:14px;cursor:pointer;align-items:center;transition:background .2s}
.row:hover,.row.on{background:var(--sel)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#1c1c22;flex:none;position:relative}
.av.on:after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#2ecc71;border:2px solid var(--card)}
.rt{flex:1;min-width:0}.rt div{display:flex;justify-content:space-between;gap:8px}
.rt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt div:first-child small{flex:none}
.badge{background:var(--dark);color:var(--darkink);border-radius:99px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;flex:none;animation:pop .4s cubic-bezier(.2,1.8,.4,1)}
.newbtn{margin:10px 16px 16px;background:var(--dark);color:var(--darkink);padding:14px;border-radius:14px;font-weight:600;font-size:14px;transition:transform .2s}
.newbtn:hover{transform:translateY(-2px)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.head b{font-size:15px;display:block}.head small{font-size:12px;color:var(--mute);transition:color .2s}
.head small.ty{color:#2ea66b}
.back{display:none}
.thread{flex:1;overflow:auto;padding:10px 18px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--mute);margin:8px 0}
.msg{max-width:min(74%,420px);padding:9px 13px 6px;border-radius:18px;font-size:14px;line-height:1.45;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;word-wrap:break-word;position:relative}
.msg.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:5px;transform-origin:bottom left}
.msg.out{background:var(--out);color:var(--outink);align-self:flex-end;border-bottom-right-radius:5px;transform-origin:bottom right}
.msg.stk{background:none;padding:0}.msg.stk .s{font-size:76px;line-height:1.1;display:block;animation:wob 2.6s 1s ease-in-out infinite}
.who{font-size:12px;font-weight:700;display:block;margin-bottom:2px}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;color:var(--mute);margin-top:3px}
.msg.out .meta{color:#69732e}
.msg.stk .meta{color:var(--mute);justify-content:flex-end}
.tick{width:17px;height:11px;color:#8c9558}
.tick svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tick .b{opacity:0;transition:opacity .3s}
.tick.d .b{opacity:1}.tick.r{color:var(--blue)}
.msg img,.msg video{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:3px}
.doc{display:flex;gap:10px;align-items:center;min-width:190px;padding-bottom:3px}
.doc i{font-style:normal;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:19px}
.doc b{font-size:13px;display:block;word-break:break-all}.doc small{font-size:11px;opacity:.65}
.typing{align-self:flex-start;background:var(--in);border-radius:18px;border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:5px;animation:pop .3s both}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bn 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-6px);opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.4) translateY(18px)}100%{opacity:1;transform:none}}
@keyframes wob{50%{transform:rotate(-7deg) scale(1.06)}}
.rip{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;border:2px solid var(--out);animation:rp .6s forwards;pointer-events:none}
@keyframes rp{to{transform:scale(3.6);opacity:0}}
.bar{display:flex;align-items:center;gap:8px;margin:8px 12px 12px;position:relative}
.bar .field{flex:1;background:var(--card);border-radius:16px;display:flex;align-items:center;padding:0 6px 0 16px}
.bar input[type=text]{flex:1;border:0;background:none;outline:0;color:var(--ink);font:inherit;font-size:14px;padding:14px 0;min-width:0}
.send{width:42px;height:42px;border-radius:50%;background:var(--dark);color:var(--darkink);display:grid;place-items:center;flex:none;font-size:15px}
.send.go{animation:fly .5s}
@keyframes fly{40%{transform:translate(9px,-9px) scale(.8) rotate(20deg)}100%{transform:none}}
.pop{position:absolute;bottom:56px;left:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.18);display:none;z-index:5;transform-origin:bottom left}
.pop.show{display:block;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.pop button.m{display:flex;gap:10px;align-items:center;padding:10px 16px 10px 10px;border-radius:12px;width:100%;font-size:14px}
.pop button.m:hover{background:var(--sel)}
.pop button.m i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.emo{left:auto;right:56px;width:290px;transform-origin:bottom right}
.emo .tt{display:flex;gap:6px;margin-bottom:6px}.emo .tt button{flex:1;padding:6px;border-radius:99px;background:var(--chip);font-size:13px}
.emo .tt button.on{background:var(--dark);color:var(--darkink)}
.eg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-height:190px;overflow:auto}
.eg.st{grid-template-columns:repeat(4,1fr)}
.eg button{font-size:22px;padding:5px;border-radius:10px;transition:transform .15s}
.eg.st button{font-size:40px}.eg button:hover{background:var(--sel);transform:scale(1.2)}
.empty{margin:auto;color:var(--mute);text-align:center}
.dlg{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:9;padding:16px}
.dlg.show{display:grid}
.box{background:var(--card);border-radius:24px;padding:22px;width:min(380px,100%);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.box h3{margin-bottom:4px}.box p{font-size:13px;color:var(--mute);margin-bottom:12px}
.box input[type=text]{width:100%;background:var(--chip);border:0;border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;font-size:14px;outline:0;margin-bottom:10px}
.pick{max-height:200px;overflow:auto;margin-bottom:12px}
.pick label{display:flex;gap:10px;align-items:center;padding:7px;border-radius:12px;cursor:pointer;font-size:14px}
.pick label:hover{background:var(--sel)}
.pick input{accent-color:#7a63d8;width:17px;height:17px}
.acts{display:flex;gap:8px}.acts button{flex:1;padding:12px;border-radius:12px;font-weight:600;background:var(--chip)}.acts button.p{background:var(--dark);color:var(--darkink)}
@media(max-width:760px){
 .app{display:block;padding:0}.rail{display:none}
 .side,.main{position:absolute;inset:10px;margin:0}.main{transform:translateX(calc(100% + 20px));transition:transform .35s cubic-bezier(.3,.9,.3,1);z-index:2}
 .app.open .main{transform:none}.back{display:grid}.msg{max-width:84%}.emo{right:0;left:auto;width:min(290px,88vw)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="side">
  <div class="top"><b>Pesan</b><div class="tg" id="tg"><button data-th="light" title="Terang">☀</button><button data-th="dark" title="Gelap">☾</button></div><button class="ib" id="newTop" title="Chat baru">✎</button></div>
  <label class="search">🔍<input id="q" placeholder="Cari chat…"></label>
  <div class="tabs" id="tabs"><button class="on" data-f="a">Semua</button><button data-f="p">Pribadi</button><button data-f="g">Grup</button></div>
  <div class="list" id="list"></div>
  <button class="newbtn" id="newBtn">✎ &nbsp;Mulai chat / grup baru</button>
 </aside>
 <section class="main">
  <div class="head"><button class="ib back" id="back">←</button><div class="av" id="hav"></div><div style="flex:1;min-width:0"><b id="hname"></b><small id="hsub"></small></div><button class="ib">🔍</button><button class="ib">⋮</button></div>
  <div class="thread" id="thread"></div>
  <div class="bar">
   <button class="ib" id="plus" style="width:40px;height:40px;font-size:20px">+</button>
   <div class="field"><input type="text" id="inp" placeholder="Tulis pesan…" autocomplete="off"><button class="ib" id="emoBtn" style="background:none">😊</button></div>
   <button class="send" id="send" aria-label="Kirim">➤</button>
   <div class="pop" id="attach">
    <button class="m" data-a="image/*"><i style="background:#d6ecff">🖼️</i>Foto</button>
    <button class="m" data-a="video/*"><i style="background:#ffd9e0">🎥</i>Video</button>
    <button class="m" data-a=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,*/*"><i style="background:#e2dbff">📄</i>Dokumen / file</button>
   </div>
   <div class="pop emo" id="emo"><div class="tt"><button class="on" data-t="e">Emoji</button><button data-t="s">Stiker</button></div><div class="eg" id="eg"></div></div>
   <input type="file" id="file" multiple hidden>
  </div>
 </section>
 <div class="dlg" id="dlg"><div class="box"><h3>Chat baru</h3><p>Pilih 1 orang untuk chat pribadi, atau 2+ orang untuk membuat grup.</p><input type="text" id="gname" placeholder="Nama grup (opsional)"><div class="pick" id="pick"></div><div class="acts"><button id="cancel">Batal</button><button class="p" id="ok">Mulai</button></div></div></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cols=['#d4ee6a','#b9a9f0','#ffc9a8','#a8dcff','#ffd1e8','#c7f0d8'];
var col=function(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%97;return cols[h%cols.length]};
var people=['Rina','Budi','Sari','Pak Andi','Dewi'];
var T='<span class="tick"><svg viewBox="0 0 17 11"><path d="M1 6l3.5 3.5L10 1"/><path class="b" d="M7 8.5l1.5 1L15 1"/></svg></span>';
var tm=function(){var d=new Date();return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var chats=[
 {id:1,n:'Tim Desain',g:1,mem:['Rina','Budi','Sari'],on:1,u:2,m:[
  {o:0,w:'Rina',k:'t',t:'Laporan desain hari ini sudah ada yang kirim? 🎨',h:'09:12'},
  {o:1,k:'t',t:'Sudah, saya kirim buktinya nanti siang ya',h:'09:14',s:2},
  {o:0,w:'Budi',k:'t',t:'Siap, ditunggu 👍',h:'09:15'}]},
 {id:2,n:'Pak Andi',on:1,u:0,m:[
  {o:0,k:'t',t:'Halo, laporan proyek sudah dikirim?',h:'08:30'},
  {o:1,k:'t',t:'Siap Pak, sebentar lagi saya lampirkan 🙏',h:'08:31',s:2}]},
 {id:3,n:'Laporan Harian',g:1,mem:['Dewi','Pak Andi','Sari','Budi'],on:1,u:0,m:[
  {o:0,w:'Dewi',k:'t',t:'Ingat ya, semua laporan harian masuk sebelum jam 5 sore.',h:'Kemarin'}]},
 {id:4,n:'Rina',on:1,u:1,m:[{o:0,k:'t',t:'Nanti makan siang bareng yuk 🍜',h:'10:02'}]},
 {id:5,n:'Dewi',on:0,u:0,m:[{o:1,k:'t',t:'Makasih ya atas bantuannya kemarin!',h:'Kemarin',s:2}]}
];
var cur=chats[0],filter='a',nid=10;
var prev=function(c){var m=c.m[c.m.length-1];if(!m)return'Belum ada pesan';var p={t:m.t,i:'🖼️ Foto',v:'🎥 Video',d:'📄 '+m.name,s:'Stiker '+m.t}[m.k];return(m.o?'Kamu: ':(m.w?m.w+': ':''))+p};
function drawList(){
 var q=$('q').value.toLowerCase(),L=$('list');L.innerHTML='';
 chats.filter(function(c){return(filter==='a'||(filter==='g')===!!c.g)&&c.n.toLowerCase().indexOf(q)>-1}).forEach(function(c){
  var r=document.createElement('div');r.className='row'+(c===cur?' on':'');
  var l=c.m[c.m.length-1];
  r.innerHTML='<div class="av'+(c.on?' on':'')+'" style="background:'+col(c.n)+'">'+(c.g?'👥':c.n[0])+'</div><div class="rt"><div><b>'+c.n+'</b><small>'+(l?l.h:'')+'</small></div><div><small>'+prev(c).replace(/</g,'&lt;')+'</small>'+(c.u?'<span class="badge">'+c.u+'</span>':'')+'</div></div>';
  r.onclick=function(){open(c)};L.appendChild(r)});
}
function head(){
 var a=$('hav');a.textContent=cur.g?'👥':cur.n[0];a.style.background=col(cur.n);a.className='av'+(cur.on?' on':'');
 $('hname').textContent=cur.n;sub()}
function sub(t){var s=$('hsub');s.textContent=t||(cur.g?cur.mem.join(', ')+', Kamu':(cur.on?'online':'terakhir dilihat hari ini'));s.className=t?'ty':''}
function mk(m){
 var d=document.createElement('div');d.className='msg '+(m.o?'out':'in')+(m.k==='s'?' stk':'');
 var b=(m.w&&cur.g?'<span class="who" style="color:#7a63d8">'+m.w+'</span>':'');
 var esc=function(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')};
 if(m.k==='t')b+=esc(m.t);
 if(m.k==='i')b+='<img src="'+m.u+'" alt="foto">';
 if(m.k==='v')b+='<video src="'+m.u+'" controls playsinline></video>';
 if(m.k==='d')b+='<div class="doc"><i>'+m.ic+'</i><div><b>'+esc(m.name)+'</b><small>'+m.sz+'</small></div></div>';
 if(m.k==='s')b+='<span class="s">'+m.t+'</span>';
 d.innerHTML=b+'<div class="meta">'+m.h+(m.o?T:'')+'</div>';
 m.el=d;tk(m);return d}
function tk(m){var t=m.el&&m.el.querySelector('.tick');if(!t)return;t.classList.toggle('d',m.s>=1);t.classList.toggle('r',m.s>=2)}
function scroll(){var t=$('thread');t.scrollTo({top:t.scrollHeight,behavior:'smooth'})}
function drawThread(){var t=$('thread');t.innerHTML='<div class="day">Hari ini</div>';
 cur.m.forEach(function(m){var e=mk(m);e.style.animation='none';t.appendChild(e)});t.scrollTop=t.scrollHeight}
function open(c){cur=c;c.u=0;head();drawThread();drawList();$('app').classList.add('open');closeP()}
function push(c,m){c.m.push(m);if(c===cur){var e=mk(m);$('thread').appendChild(e);scroll();return e}else{c.u++}drawList()}
function bump(c){chats.splice(chats.indexOf(c),1);chats.unshift(c);drawList()}
function sendMsg(m){
 var c=cur;m.o=1;m.h=tm();m.s=0;
 var e=push(c,m);bump(c);
 var s=$('send');s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
 if(e){var r=document.createElement('span');r.className='rip';e.appendChild(r)}
 setTimeout(function(){m.s=1;tk(m)},800);
 setTimeout(function(){m.s=2;tk(m)},2000);
 reply(c,m)}
var R=['Oke, noted 👍','Siap, makasih ya!','Mantap, lanjut!','Baik, nanti saya cek dulu','Sip, laporan diterima ✅','Oke, saya kabari lagi ya'];
var RK={i:['Fotonya jelas, makasih 📸','Bukti diterima, mantap!'],v:['Videonya sudah saya lihat 🎥','Oke, videonya jelas 👍'],d:['Dokumen diterima, saya cek ya 📄','Makasih, file sudah masuk ✅']};
async function reply(c,m){
 await sleep(2300);
 var w=c.g?c.mem[Math.floor(Math.random()*c.mem.length)]:null;
 if(c===cur)sub((w||c.n)+' sedang mengetik…');
 var ty;if(c===cur){ty=document.createElement('div');ty.className='typing';ty.innerHTML='<span></span><span></span><span></span>';$('thread').appendChild(ty);scroll()}
 await sleep(1800);
 if(ty)ty.remove();if(c===cur)sub();
 var pool=RK[m.k]||R,t=pool[Math.floor(Math.random()*pool.length)];
 var rm=m.k==='s'?{k:'s',t:m.t}:{k:'t',t:t};
 rm.o=0;rm.w=w;rm.h=tm();push(c,rm);bump(c)}
function send(){var v=$('inp').value.trim();if(!v)return;$('inp').value='';sendMsg({k:'t',t:v})}
$('send').onclick=send;
$('inp').onkeydown=function(e){if(e.key==='Enter')send()};
function closeP(){$('attach').classList.remove('show');$('emo').classList.remove('show')}
$('plus').onclick=function(e){e.stopPropagation();var o=$('attach').classList.contains('show');closeP();if(!o)$('attach').classList.add('show')};
$('emoBtn').onclick=function(e){e.stopPropagation();var o=$('emo').classList.contains('show');closeP();if(!o){$('emo').classList.add('show');egrid('e')}};
document.addEventListener('click',function(e){if(!e.target.closest('.pop'))closeP()});
var EM='😀 😂 🥹 😍 😎 🤔 😅 🙏 👍 👏 🔥 🎉 ✅ ❤️ 💪 🙌 😴 🤝 📌 📎 💡 ⏰ 🚀 ☕ 🍜 😭 🥳 👀 💯 ✨ 📸 🎥'.split(' '),ST='🥳 🎉 😻 🐶 🐱 🦊 🐼 🚀 💖 🔥 🏆 🎂'.split(' ');
function egrid(t){var g=$('eg');g.className='eg'+(t==='s'?' st':'');g.innerHTML='';
 (t==='s'?ST:EM).forEach(function(x){var b=document.createElement('button');b.textContent=x;b.onclick=function(e){e.stopPropagation();if(t==='s'){sendMsg({k:'s',t:x});closeP()}else{$('inp').value+=x;$('inp').focus()}};g.appendChild(b)});
 document.querySelectorAll('.emo .tt button').forEach(function(b){b.className=b.dataset.t===t?'on':''})}
document.querySelectorAll('.emo .tt button').forEach(function(b){b.onclick=function(e){e.stopPropagation();egrid(b.dataset.t)}});
document.querySelectorAll('#attach .m').forEach(function(b){b.onclick=function(){$('file').accept=b.dataset.a;$('file').click();closeP()}});
var fs=function(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'};
$('file').onchange=function(){Array.prototype.forEach.call(this.files,function(f,i){setTimeout(function(){
 var m;if(f.type.indexOf('image')===0)m={k:'i',u:URL.createObjectURL(f)};
 else if(f.type.indexOf('video')===0)m={k:'v',u:URL.createObjectURL(f)};
 else{var x=f.name.split('.').pop().toLowerCase();m={k:'d',name:f.name,sz:fs(f.size),ic:{pdf:'📕',xls:'📊',xlsx:'📊',doc:'📘',docx:'📘',ppt:'📙',pptx:'📙',zip:'🗜️'}[x]||'📄'}}
 sendMsg(m)},i*400)});this.value=''};
$('q').oninput=drawList;
$('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});drawList()};
$('back').onclick=function(){$('app').classList.remove('open')};
function dlg(){var p=$('pick');p.innerHTML='';$('gname').value='';people.forEach(function(n){p.insertAdjacentHTML('beforeend','<label><input type="checkbox" value="'+n+'"><span class="av" style="width:32px;height:32px;font-size:13px;background:'+col(n)+'">'+n[0]+'</span>'+n+'</label>')});$('dlg').classList.add('show')}
$('newBtn').onclick=$('newTop').onclick=dlg;

$('ok').onclick=function(){
 var s=[].map.call(document.querySelectorAll('#pick input:checked'),function(i){return i.value});
 if(!s.length)return;$('dlg').classList.remove('show');
 if(s.length===1){var ex=chats.filter(function(c){return !c.g&&c.n===s[0]})[0];if(!ex){ex={id:nid++,n:s[0],on:1,u:0,m:[]};chats.unshift(ex)}open(ex)}
 else{var g={id:nid++,n:$('gname').value.trim()||'Grup Baru',g:1,mem:s,on:1,u:0,m:[{o:0,w:s[0],k:'t',t:'Grup dibuat. Selamat datang semua! 🎉',h:tm()}]};chats.unshift(g);open(g)}};
$('dlg').onclick=function(e){if(e.target===this)this.classList.remove('show')};
chats.forEach(function(c){c.m.forEach(function(m){m.s=m.s||0})});
var th;try{th=localStorage.getItem('lw-th')||localStorage.getItem('laporanwee_theme')}catch(e){}
var urlP=new URLSearchParams(location.search);
if(urlP.get('theme'))th=urlP.get('theme');
var mq=matchMedia('(prefers-color-scheme:dark)');
function setTh(t,save){document.documentElement.dataset.theme=t;document.querySelectorAll('#tg button').forEach(function(b){b.classList.toggle('on',b.dataset.th===t)});if(save){th=t;try{localStorage.setItem('lw-th',t);localStorage.setItem('laporanwee_theme',t)}catch(e){}}}
setTh(th||(mq.matches?'dark':'light'));
mq.onchange=function(e){if(!th)setTh(e.matches?'dark':'light')};
$('tg').onclick=function(e){var b=e.target.closest('button');if(b)setTh(b.dataset.th,1)};

head();drawThread();drawList();
if(innerWidth<=760)$('app').classList.remove('open');
})();
