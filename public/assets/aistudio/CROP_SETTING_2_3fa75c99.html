<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaporanWee — Crop Foto Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style id="pc-design">
:root{
  --pc-ink:#1f1d2b;--pc-muted:#7d7a8c;--pc-surface:rgba(255,255,255,.96);--pc-glass:rgba(255,255,255,.7);--pc-line:rgba(31,29,43,.1);
  --pc-dark:#23212e;--pc-on-dark:#fff;--pc-lime:#d4ee6b;--pc-lav:#d9d3f5;--pc-accent:#7a69d0;--pc-scrim:rgba(30,26,50,.38);
  --pc-ease:cubic-bezier(.22,1,.36,1);--pc-spring:cubic-bezier(.34,1.56,.64,1);--pc-stage:min(280px,62vw);
}
[data-theme=dark]{
  --pc-ink:#f2f0fa;--pc-muted:#9a97ad;--pc-surface:rgba(40,38,56,.96);--pc-glass:rgba(60,57,82,.7);--pc-line:rgba(255,255,255,.12);
  --pc-dark:#f2f0fa;--pc-on-dark:#1f1d2b;--pc-lav:#3b3560;--pc-accent:#a99bf0;--pc-scrim:rgba(8,6,16,.6);
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden;
  background:radial-gradient(800px 560px at 0% 100%,rgba(176,160,240,.5),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(244,214,170,.6),transparent 60%),linear-gradient(135deg,#e6e5ec,#f1f0f5);background-attachment:fixed}
[data-theme=dark] body{background:radial-gradient(800px 560px at 0% 100%,rgba(110,90,200,.4),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(200,140,80,.2),transparent 60%),linear-gradient(135deg,#14131b,#1b1a24)}

.pc-ov{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:16px;background:var(--pc-scrim);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--pc-ink);
  visibility:hidden;opacity:0;pointer-events:none;transition:opacity .35s var(--pc-ease),visibility 0s linear .35s}
.pc-ov.pc-show{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .35s var(--pc-ease),visibility 0s}
.pc-modal{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;padding:26px 28px 28px;border-radius:36px;
  background:var(--pc-surface);border:1px solid var(--pc-line);box-shadow:0 40px 90px -30px rgba(0,0,0,.55);
  transform:translateY(24px) scale(.96);opacity:0;transition:transform .5s var(--pc-spring),opacity .35s var(--pc-ease)}
.pc-show .pc-modal{transform:none;opacity:1}
.pc-grab{display:none;width:44px;height:5px;border-radius:9px;background:var(--pc-line);margin:0 auto 14px}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pc-head h2{font-size:23px;font-weight:600;letter-spacing:-.02em}
.pc-hint-t{color:var(--pc-muted);font-size:14px;line-height:1.5;margin:6px 0 18px}
.pc-x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pc-glass);border:0;color:inherit;cursor:pointer;flex:none;transition:transform .3s}
.pc-x:hover{transform:rotate(90deg)}
.pc-x svg,.pc-b svg,.pc-pad svg,.pc-tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc-main{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px}
.pc-stage{position:relative;width:var(--pc-stage);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--pc-line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 0 0 6px var(--pc-glass),0 28px 50px -24px rgba(60,50,110,.7);isolation:isolate}
.pc-stage.pc-drag{cursor:grabbing;box-shadow:0 0 0 6px var(--pc-lav),0 34px 56px -22px rgba(60,50,110,.8)}
.pc-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;-webkit-user-drag:none;user-select:none;will-change:transform}
.pc-ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8);pointer-events:none;z-index:2}
.pc-grid{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;transition:opacity .3s;
  background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.5) 33% calc(33% + 1px),transparent calc(33% + 1px) 66%,rgba(255,255,255,.5) 66% calc(66% + 1px),transparent calc(66% + 1px)),
  linear-gradient(transparent 33%,rgba(255,255,255,.5) 33% calc(33% + 1px),transparent calc(33% + 1px) 66%,rgba(255,255,255,.5) 66% calc(66% + 1px),transparent calc(66% + 1px))}
.pc-stage.pc-act .pc-grid{opacity:1}
.pc-tip{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:3;padding:6px 13px;border-radius:999px;background:rgba(20,18,30,.62);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(6px);transition:opacity .3s}
.pc-stage.pc-touched .pc-tip{opacity:0}
.pc-dropmsg{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:30px;font-weight:500;font-size:15px;color:#fff;background:rgba(122,105,208,.72);opacity:0;pointer-events:none;backdrop-filter:blur(4px);transition:opacity .3s}
.pc-stage.pc-over .pc-dropmsg{opacity:1}
.pc-prevs{display:flex;flex-direction:column;align-items:center;gap:12px}.pc-prevs small{font-size:11px;color:var(--pc-muted)}
.pc-pv{position:relative;overflow:hidden;border-radius:50%;background:var(--pc-line);box-shadow:0 0 0 3px var(--pc-glass)}
.pc-pv img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
.pc-pv.l{width:72px;height:72px}.pc-pv.m{width:44px;height:44px}.pc-pv.s{width:28px;height:28px}
.pc-panels{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-bottom:18px}
.pc-panel{padding:16px 18px;border-radius:24px;background:var(--pc-glass);border:1px solid var(--pc-line)}
.pc-panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--pc-muted);margin-bottom:12px}
.pc-dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:6px;justify-content:center}
.pc-pad{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pc-surface);border:1px solid var(--pc-line);color:inherit;cursor:pointer;touch-action:none}
.pc-pad[data-d=up]{grid-area:1/2}.pc-pad[data-d=left]{grid-area:2/1}.pc-pad[data-d=center]{grid-area:2/2;background:var(--pc-dark);color:var(--pc-on-dark);border-color:transparent}
.pc-pad[data-d=right]{grid-area:2/3}.pc-pad[data-d=down]{grid-area:3/2}
.pc-read{margin-top:12px;text-align:center;font-size:12.5px;color:var(--pc-muted);font-variant-numeric:tabular-nums}
.pc-zoom{display:grid;grid-template-columns:40px 1fr 40px 48px;align-items:center;gap:10px;margin-bottom:16px}
.pc-zoom output{font-size:12.5px;color:var(--pc-muted);text-align:right;font-variant-numeric:tabular-nums}
.pc-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pc-surface);border:1px solid var(--pc-line);color:inherit;cursor:pointer}
.pc-range{appearance:none;-webkit-appearance:none;width:100%;height:6px;border-radius:9px;background:var(--pc-line);outline:0}
.pc-range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--pc-dark);border:3px solid var(--pc-surface);box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:grab}
.pc-tools{display:flex;gap:8px;flex-wrap:wrap}
.pc-tool{height:42px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;background:var(--pc-surface);border:1px solid var(--pc-line);font:inherit;font-size:13.5px;font-weight:500;color:inherit;cursor:pointer}
.pc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc-actions .pc-full{grid-column:1/-1}
.pc-b{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 22px;border-radius:999px;font:inherit;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;cursor:pointer;border:0;color:inherit;width:100%}
.pc-b.dark{background:var(--pc-dark);color:var(--pc-on-dark);box-shadow:0 16px 28px -14px rgba(35,33,46,.7)}
.pc-b.soft{background:var(--pc-glass);border:1px solid var(--pc-line)}
.pc-b .pc-spn{position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid transparent;border-top-color:currentColor;opacity:0}

.pc-b.pc-load{pointer-events:auto}
.pc-b.pc-load > *:not(.pc-spn){opacity:0}
.pc-b.pc-load .pc-spn{opacity:1;animation:pc-spin .8s linear infinite}
@keyframes pc-spin{to{transform:rotate(360deg)}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.pc-reopen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);height:50px;padding:0 26px;border-radius:999px;border:0;cursor:pointer;
  font:600 15px 'Outfit',system-ui,sans-serif;background:var(--pc-dark);color:var(--pc-on-dark);box-shadow:0 18px 32px -14px rgba(35,33,46,.7);
  display:none}
.pc-reopen.show{display:inline-flex;align-items:center;justify-content:center}

@media(max-width:640px){
  .pc-ov{place-items:end center;padding:0}
  .pc-modal{width:100%;max-height:94dvh;border-radius:34px 34px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom))}
  .pc-grab{display:block}.pc-main{flex-direction:column;gap:14px}.pc-prevs{flex-direction:row}
  .pc-panels{grid-template-columns:1fr}
}
</style>
</head>
<body>

<button class="pc-reopen" id="pc-reopen" type="button">Buka Edit Foto Profil</button>

<div class="pc-ov" id="pc" inert aria-hidden="true">
  <div class="pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-title">
    <div class="pc-grab"></div>
    <div class="pc-head">
      <h2 id="pc-title">Edit Foto Profil</h2>
      <button type="button" class="pc-x" data-pc-close aria-label="Tutup">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="pc-hint-t">Seret foto atau pakai tombol arah untuk menggeser kanan, kiri, atas, dan bawah. Atur zoom, lalu klik Simpan Foto.</p>

    <div class="pc-main">
      <div class="pc-stage" id="pc-stage" tabindex="0" role="application">
        <img id="pc-img" alt="Pratinjau crop" draggable="false">
        <div class="pc-grid"></div><div class="pc-ring"></div>
        <div class="pc-tip">Seret untuk menggeser</div>
        <div class="pc-dropmsg">Lepas foto di sini</div>
      </div>
      <div class="pc-prevs" aria-hidden="true">
        <div class="pc-pv l"><img alt=""></div>
        <div class="pc-pv m"><img alt=""></div>
        <div class="pc-pv s"><img alt=""></div>
        <small>Pratinjau</small>
      </div>
    </div>

    <div class="pc-panels">
      <section class="pc-panel" aria-label="Geser posisi foto">
        <h3>Geser</h3>
        <div class="pc-dpad">
          <button type="button" class="pc-pad" data-d="up" aria-label="Atas"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button>
          <button type="button" class="pc-pad" data-d="left" aria-label="Kiri"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
          <button type="button" class="pc-pad" data-d="center" aria-label="Pusatkan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
          <button type="button" class="pc-pad" data-d="right" aria-label="Kanan"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
          <button type="button" class="pc-pad" data-d="down" aria-label="Bawah"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button>
        </div>
        <div class="pc-read" id="pc-read"></div>
      </section>
      <section class="pc-panel">
        <h3>Zoom</h3>
        <div class="pc-zoom">
          <button type="button" class="pc-ico" id="pc-zm">-</button>
          <input class="pc-range" id="pc-zr" type="range" min="100" max="300" value="100">
          <button type="button" class="pc-ico" id="pc-zp">+</button>
          <output id="pc-zo">100%</output>
        </div>
        <h3>Orientasi</h3>
        <div class="pc-tools">
          <button type="button" class="pc-tool" id="pc-rot"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1-1 5M4 4v5h5"/></svg>Putar</button>
          <button type="button" class="pc-tool" id="pc-flip"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7 3 12l5 5zM16 7l5 5-5 5z"/></svg>Balik</button>
        </div>
      </section>
    </div>

    <div class="pc-actions">
      <label class="pc-b soft pc-full" for="pc-file">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>Pilih Foto Baru
      </label>
      <input class="sr-only" id="pc-file" type="file" accept="image/*">
      <button type="button" class="pc-b soft" id="pc-reset">Reset</button>
      <button type="button" class="pc-b dark" id="pc-save">
        <span>Simpan Foto</span><i class="pc-spn"></i>
      </button>
    </div>
  </div>
</div>

<script>
const ENDPOINT_API = 'https://api-laporanwe.mkverse.my.id/api/profile/setting-profil-picture/index.php';

function createPhotoCropper() {
  const $ = (s, r) => (r || document).querySelector(s);
  const root = $('#pc'), stage = $('#pc-stage'), img = $('#pc-img');
  const pvBox = [...root.querySelectorAll('.pc-pv')], pvImg = pvBox.map(b => $('img', b)), pads = [...root.querySelectorAll('.pc-pad')];
  const MAXDIM = 2048, STEP = 34, HOLD_SPEED = 3.4;
  let CS = 280, nw = 0, nh = 0, base = 1, z = 1, px = 0, py = 0, vx = 0, vy = 0, src = '', orig = '', dragging = false, hold = null, raf = 0, last = null, pinch = null, touched = false;
  const ptrs = new Map();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lim = () => ({ x: Math.min(0, CS - nw * base * z), y: Math.min(0, CS - nh * base * z) });
  const elastic = (v, lo, hi) => v < lo ? lo + (v - lo) * .35 : v > hi ? hi + (v - hi) * .35 : v;

  function draw() {
    const L = lim(), ex = elastic(px, L.x, 0), ey = elastic(py, L.y, 0), s = base * z;
    img.style.transform = `translate(${ex}px,${ey}px) scale(${s})`;
    pvBox.forEach((b, i) => { const r = b.clientWidth / CS; pvImg[i].style.transform = `translate(${ex * r}px,${ey * r}px) scale(${s * r})`; });
    const cx = clamp(px, L.x, 0), cy = clamp(py, L.y, 0), ox = -L.x, oy = -L.y;
    const X = ox > 1 ? Math.round(-cx / ox * 100) : 50, Y = oy > 1 ? Math.round(-cy / oy * 100) : 50;
    $('#pc-read').innerHTML = (ox > 1 || oy > 1) ? `Posisi <b>X ${X}%</b> · <b>Y ${Y}%</b>` : 'Foto pas — perbesar zoom untuk menggeser';
    $('#pc-zr').value = Math.round(z * 100); $('#pc-zo').textContent = Math.round(z * 100) + '%';
    $('#pc-zm').disabled = z <= 1; $('#pc-zp').disabled = z >= 3;
  }

  function loop() {
    raf = 0; let on = dragging; const L = lim();
    if (hold) { px = clamp(px + hold.x * HOLD_SPEED, L.x, 0); py = clamp(py + hold.y * HOLD_SPEED, L.y, 0); on = true; vx = vy = 0; }
    else if (!dragging) {
      if (Math.abs(vx) > .15 || Math.abs(vy) > .15) { px += vx; py += vy; vx *= .93; vy *= .93; on = true; }
      const tx = clamp(px, L.x, 0), ty = clamp(py, L.y, 0);
      if (Math.abs(tx - px) > .25 || Math.abs(ty - py) > .25) { px += (tx - px) * .2; py += (ty - py) * .2; vx *= .8; vy *= .8; on = true; } else { px = tx; py = ty; }
    }
    draw(); if (on) raf = requestAnimationFrame(loop);
  }

  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  const smooth = () => { stage.classList.add('pc-smooth'); pvBox.forEach(b => b.classList.add('pc-smooth')); setTimeout(() => { stage.classList.remove('pc-smooth'); pvBox.forEach(b => b.classList.remove('pc-smooth')); }, 340); };
  const flash = () => { stage.classList.add('pc-act'); if (!touched) { touched = true; stage.classList.add('pc-touched'); } setTimeout(() => stage.classList.remove('pc-act'), 900); };
  const settle = () => { const L = lim(); px = clamp(px, L.x, 0); py = clamp(py, L.y, 0); vx = vy = 0; };
  function step(dx, dy) { settle(); const L = lim(); px = clamp(px + dx, L.x, 0); py = clamp(py + dy, L.y, 0); smooth(); draw(); flash(); }
  function setZ(v, anim) { settle(); const nz = clamp(v, 1, 3), cx = (CS / 2 - px) / (base * z), cy = (CS / 2 - py) / (base * z); z = nz; px = CS / 2 - cx * base * z; py = CS / 2 - cy * base * z; settle(); if (anim) smooth(); draw(); flash(); }

  function setImg(url) {
    src = url;
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      nw = img.naturalWidth || 480; nh = img.naturalHeight || 480;
      CS = stage.clientWidth || 280; base = CS / Math.min(nw, nh); z = 1;
      px = (CS - nw * base) / 2; py = (CS - nh * base) / 2; vx = vy = 0;
      pvImg.forEach(i => { i.src = url; i.style.width = nw + 'px'; i.style.height = nh + 'px'; });
      img.style.width = nw + 'px'; img.style.height = nh + 'px';
      draw();
    };
    img.src = url;
  }

  stage.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { last = { x: e.clientX, y: e.clientY, t: performance.now() }; vx = vy = 0; dragging = true; stage.classList.add('pc-drag'); }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z }; dragging = false; }
    flash(); kick();
  });

  stage.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()]; setZ(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
    if (ptrs.size === 1 && last) {
      const n = performance.now(), dx = e.clientX - last.x, dy = e.clientY - last.y, dt = Math.max(1, n - last.t);
      px += dx; py += dy; vx = dx / dt * 16; vy = dy / dt * 16; last = { x: e.clientX, y: e.clientY, t: n }; kick();
    }
  });

  const up = e => {
    if (!ptrs.delete(e.pointerId)) return;
    pinch = null;
    if (ptrs.size === 0) { dragging = false; last = null; stage.classList.remove('pc-drag'); kick(); }
    else { const [a] = [...ptrs.values()]; last = { x: a.x, y: a.y, t: performance.now() }; dragging = true; }
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  stage.addEventListener('wheel', e => { e.preventDefault(); setZ(z * Math.exp(-e.deltaY * .0015)); }, { passive: false });

  const DIR = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  let hT = 0, held = false, activePad = null;
  const stopHold = () => { clearTimeout(hT); if (activePad) { activePad.classList.remove('pc-hold'); activePad = null; } if (hold) { hold = null; held = true; kick(); } };

  pads.forEach(p => {
    const d = p.dataset.d;
    p.addEventListener('pointerdown', e => {
      if (d === 'center') return;
      p.setPointerCapture(e.pointerId); held = false; activePad = p; settle();
      hT = setTimeout(() => { if (!activePad) return; hold = { x: DIR[d][0], y: DIR[d][1] }; held = true; p.classList.add('pc-hold'); flash(); kick(); }, 240);
    });
    p.addEventListener('click', e => {
      if (d === 'center') { px = (CS - nw * base * z) / 2; py = (CS - nh * base * z) / 2; settle(); smooth(); draw(); flash(); return; }
      if (e.detail > 0 && held) { held = false; return; }
      step(DIR[d][0] * STEP, DIR[d][1] * STEP);
    });
  });

  addEventListener('pointerup', stopHold);
  addEventListener('pointercancel', stopHold);

  $('#pc-zr').addEventListener('input', e => setZ(e.target.value / 100));
  $('#pc-zp').onclick = () => setZ(z + .2, 1);
  $('#pc-zm').onclick = () => setZ(z - .2, 1);
  $('#pc-reset').onclick = () => { setImg(orig); flash(); };

  function bake(rot) {
    const c = document.createElement('canvas'), g = c.getContext('2d');
    c.width = rot ? nh : nw; c.height = rot ? nw : nh;
    g.translate(c.width / 2, c.height / 2);
    if (rot) g.rotate(-Math.PI / 2); else g.scale(-1, 1);
    g.drawImage(img, -nw / 2, -nh / 2);
    setImg(c.toDataURL('image/jpeg', .95));
  }
  $('#pc-rot').onclick = () => bake(true);
  $('#pc-flip').onclick = () => bake(false);

  function readFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        let url = r.result;
        const m = Math.max(im.naturalWidth, im.naturalHeight);
        if (m > MAXDIM) {
          const k = MAXDIM / m, c = document.createElement('canvas');
          c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          url = c.toDataURL('image/jpeg', .92);
        }
        orig = url; setImg(url);
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  }

  $('#pc-file').onchange = e => { readFile(e.target.files[0]); e.target.value = ''; };
  ['dragenter', 'dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add('pc-over') }));
  ['dragleave', 'drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('pc-over') }));
  stage.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));

  $('#pc-save').onclick = async e => {
    const b = e.currentTarget;
    if (!nw) return;

    b.classList.add('pc-load');
    settle(); draw();

    const o = document.createElement('canvas');
    o.width = o.height = 512;
    const g = o.getContext('2d'), k = 512 / CS;
    g.fillStyle = '#fff';
    g.fillRect(0, 0, 512, 512);
    g.drawImage(img, 0, 0, nw, nh, px * k, py * k, nw * base * z * k, nh * base * z * k);

    o.toBlob(async blob => {
      if (!blob) {
        b.classList.remove('pc-load');
        return;
      }

      try {
        const token = localStorage.getItem('auth_token') || localStorage.getItem('token') || '';
        const fd = new FormData();
        fd.append('avatar', blob, `avatar_${Date.now()}.jpg`);

        const res = await fetch(ENDPOINT_API, {
          method: 'POST',
          headers: {
            'Authorization': token ? `Bearer ${token}` : ''
          },
          body: fd
        });

        const resJson = await res.json();

        if (resJson.success) {
          const finalUrl = `${resJson.data.avatar_url}?t=${Date.now()}`;
          const mainImg = document.querySelector('#mainAvatarImg') || document.querySelector('.pimg img');
          if (mainImg) {
            mainImg.src = finalUrl;
            mainImg.style.display = 'block';
          }
          alert('Foto profil berhasil disimpan ke server!');
          close();
        } else {
          alert(resJson.message || 'Gagal menyimpan foto.');
        }
      } catch (err) {
        alert('Gagal terhubung ke endpoint API server.');
      } finally {
        b.classList.remove('pc-load');
      }
    }, 'image/jpeg', 0.92);
  };

  function open(url) {
    orig = url; touched = false;
    stage.classList.remove('pc-touched');
    root.inert = false; root.removeAttribute('aria-hidden');
    root.classList.add('pc-show');
    document.documentElement.style.overflow = 'hidden';

    // Proteksi PushState jika dibuka dari file lokal (file:///)
    if (window.location.protocol.startsWith('http') && window.history && window.history.pushState) {
      try {
        window.history.pushState({ modal: 'setting-picture' }, '', '/profil/setting-profile-picture');
      } catch (e) {}
    }

    setImg(url);
    setTimeout(() => stage.focus({ preventScroll: true }), 180);
  }

  function close() {
    root.classList.remove('pc-show');
    root.inert = true; root.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    stopHold();
    $('#pc-reopen').classList.add('show');

    if (window.location.protocol.startsWith('http') && window.history && window.history.pushState && window.location.pathname.includes('/setting-profile-picture')) {
      try {
        window.history.pushState({}, '', '/profil');
      } catch (e) {}
    }
  }

  root.addEventListener('click', e => { if (e.target === root || e.target.closest('[data-pc-close]')) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && root.classList.contains('pc-show')) close(); });
  $('#pc-reopen').onclick = () => { $('#pc-reopen').classList.remove('show'); open(orig); };

  return { open, close };
}

// Inisialisasi: Otomatis Langsung Terbuka
(async function() {
  const cropper = createPhotoCropper();
  window.photoCropper = cropper;

  let photoUrl = '';
  const token = localStorage.getItem('auth_token') || localStorage.getItem('token') || '';

  // Coba ambil avatar dari server jika ada jaringan
  if (token) {
    try {
      const res = await fetch(ENDPOINT_API, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/json'
        }
      });
      const json = await res.json();
      if (json.success && json.data && json.data.avatar_url) {
        photoUrl = `${json.data.avatar_url}?t=${Date.now()}`;
      }
    } catch (e) {}
  }

  // Jika lokal/belum login, render starter gradient avatar secara instan
  if (!photoUrl) {
    const c = document.createElement('canvas'); c.width = c.height = 640;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 640, 640);
    gr.addColorStop(0, '#cfc6f4'); gr.addColorStop(.55, '#e3ddfa'); gr.addColorStop(1, '#d4ee6b');
    g.fillStyle = gr; g.fillRect(0, 0, 640, 640);
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(470, 150, 190, 0, 7); g.fill();
    g.fillStyle = 'rgba(143,127,224,.4)'; g.beginPath(); g.arc(110, 540, 230, 0, 7); g.fill();
    g.fillStyle = '#2a2440'; g.font = '500 240px Outfit,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('R', 320, 350);
    photoUrl = c.toDataURL('image/jpeg', 0.95);
  }

  // Langsung tampilkan modal tanpa menunggu URL rute server
  cropper.open(photoUrl);
})();
</script>
