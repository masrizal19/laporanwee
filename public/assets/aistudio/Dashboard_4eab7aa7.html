<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaporanWee — Prototipe Desain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e6e5ec;--bg2:#f1f0f5;--ink:#1f1d2b;--muted:#8b8898;--glass:rgba(255,255,255,.62);--glass-solid:rgba(255,255,255,.9);
  --line:rgba(31,29,43,.08);--dark:#23212e;--on-dark:#fff;--lime:#d4ee6b;--lime-soft:#e9f5b8;--lav:#d9d3f5;--lav-deep:#8f7fe0;
  --peach:#f6e6cf;--mint:#d6ecdf;--pink:#f1d8e4;--blob1:rgba(176,160,240,.55);--blob2:rgba(244,214,170,.6);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 22px 44px -28px rgba(60,50,110,.4);
  --ease:cubic-bezier(.22,1,.36,1);--rail:84px;--rail-open:236px;
}
[data-theme=dark]{
  --bg1:#14131b;--bg2:#1b1a24;--ink:#f2f0fa;--muted:#8d8aa0;--glass:rgba(40,38,54,.6);--glass-solid:rgba(46,44,62,.92);
  --line:rgba(255,255,255,.08);--dark:#f2f0fa;--on-dark:#1f1d2b;--lime-soft:rgba(212,238,107,.18);--lav:#3b3560;
  --peach:#4a3d33;--mint:#2f4a3e;--pink:#4a3342;--blob1:rgba(110,90,200,.4);--blob2:rgba(200,140,80,.22);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 50px -30px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .6s var(--ease),color .4s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--lav-deep);outline-offset:3px}

/* ambient blobs (video: kabut hangat bergerak pelan) */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);transition:background .6s}
.ambient i:nth-child(1){width:620px;height:620px;left:-160px;bottom:-200px;background:var(--blob1);animation:drift1 22s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:560px;height:560px;right:-140px;top:-180px;background:var(--blob2);animation:drift2 26s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:380px;height:380px;left:42%;top:38%;background:var(--blob1);opacity:.35;animation:drift2 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(120px,-80px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-110px,90px) scale(1.1)}}

/* rail */
.rail{position:fixed;z-index:50;inset:14px auto 14px 14px;width:var(--rail);padding:18px 14px;display:flex;flex-direction:column;gap:16px;
  background:var(--glass);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;transition:width .5s var(--ease)}
.rail:hover,.rail:focus-within{width:var(--rail-open)}
.logo{display:flex;align-items:center;gap:12px;height:48px;padding-left:4px;white-space:nowrap;font-weight:600;font-size:19px;letter-spacing:-.02em}
.logo b{width:40px;height:40px;border-radius:14px;background:var(--dark);flex:none;display:grid;place-items:center}
.logo b svg{width:22px;height:22px;stroke:var(--on-dark)}
.logo em{font-style:normal;opacity:0;transition:opacity .3s}
.rail:hover .logo em,.rail:focus-within .logo em{opacity:1;transition-delay:.1s}
.logo em span{color:var(--lav-deep)}
.nav{position:relative;display:flex;flex-direction:column;gap:6px;flex:1}
.pill{position:absolute;left:0;right:0;top:0;height:48px;border-radius:18px;background:var(--dark);box-shadow:0 14px 26px -14px rgba(35,33,46,.65);
  transition:transform .55s var(--ease);z-index:0}
.nav button{position:relative;z-index:1;display:flex;align-items:center;height:48px;border-radius:18px;color:var(--muted);white-space:nowrap;
  font-weight:500;transition:color .35s var(--ease),background .3s}
.nav button:hover{background:var(--glass-solid)}
.nav button.on{color:var(--on-dark);background:none}
.nav svg{width:20px;height:20px;margin:0 14px;flex:none;stroke:currentColor}
.nav span{opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .5s var(--ease)}
.rail:hover .nav span,.rail:focus-within .nav span{opacity:1;transform:none;transition-delay:.08s}
.rail-foot{display:flex;flex-direction:column;gap:8px}
.rail-foot button{display:flex;align-items:center;height:48px;border-radius:18px;color:var(--muted);white-space:nowrap}
.rail-foot button:hover{background:var(--glass-solid);color:var(--ink)}
.rail-foot svg{width:20px;height:20px;margin:0 14px;flex:none;stroke:currentColor}
.rail-foot span{opacity:0;transition:opacity .3s}
.rail:hover .rail-foot span{opacity:1}

/* layout */
.main{position:relative;z-index:1;padding:26px 34px 56px calc(var(--rail) + 48px);max-width:1560px;margin:auto;transition:padding .4s}
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.top .crumb{font-weight:500;font-size:15px;color:var(--muted);flex:1}
.theme{position:relative;display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px)}
.theme button{position:relative;z-index:1;width:36px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--muted);transition:color .3s}
.theme button svg{width:16px;height:16px;stroke:currentColor}
.theme .knob{position:absolute;top:4px;left:4px;width:36px;height:32px;border-radius:999px;background:var(--glass-solid);box-shadow:0 4px 10px -4px rgba(0,0,0,.25);transition:transform .5s var(--ease)}
[data-theme=dark] .theme .knob{transform:translateX(36px)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);transition:transform .3s var(--ease)}
.round:hover{transform:translateY(-2px)}
.round svg{width:18px;height:18px;stroke:currentColor}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#2a2440;background:linear-gradient(135deg,var(--lav),var(--lime));border:2px solid var(--glass-solid)}

.head{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:28px}
.head h1{font-size:clamp(30px,4vw,46px);font-weight:500;letter-spacing:-.035em;line-height:1.05}
.head p{color:var(--muted);margin-top:8px}
.head .grow{flex:1;min-width:240px}
.kpi{min-width:112px}.kpi small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.kpi strong{font-size:40px;font-weight:400;letter-spacing:-.045em;line-height:1}
.kpi sup{font-size:14px;color:var(--lav-deep);margin-left:3px}
.cta{display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 26px;border-radius:999px;background:var(--dark);color:var(--on-dark);font-weight:500;
  box-shadow:0 16px 30px -14px rgba(35,33,46,.7);transition:transform .35s var(--ease),box-shadow .35s}
.cta:hover{transform:translateY(-3px);box-shadow:0 22px 34px -14px rgba(35,33,46,.75)}
.cta:active{transform:scale(.97)}
.cta svg{width:16px;height:16px;stroke:currentColor}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.card{background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line);
  border-radius:30px;padding:10px;box-shadow:var(--shadow);transition:transform .5s var(--ease),box-shadow .5s,background .4s}
.card h3{font-size:17px;font-weight:600;letter-spacing:-.015em}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 14px}
.inner{background:var(--glass-solid);border-radius:22px;padding:18px;transition:background .5s}
.c5{grid-column:span 5}.c7{grid-column:span 7}.c4{grid-column:span 4}.c8{grid-column:span 8}.c12{grid-column:span 12}.c3{grid-column:span 3}.c6{grid-column:span 6}

/* todo */
.todo{display:flex;flex-direction:column;gap:10px}
.t{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--glass-solid);border:1px solid var(--line);transition:transform .4s var(--ease),opacity .4s}
.t:hover{transform:translateX(4px)}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:background .35s var(--ease),border-color .3s,transform .4s var(--ease)}
.chk svg{width:15px;height:15px;stroke:#2a3308;stroke-width:3;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .45s var(--ease) .1s}
.t.done .chk{background:var(--lime);border-color:var(--lime);transform:scale(1.08)}
.t.done .chk svg{stroke-dashoffset:0}
.t b{font-weight:500;font-size:15px;position:relative;display:inline-block}
.t b::after{content:"";position:absolute;left:0;top:55%;height:1.5px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.t.done{opacity:.55}.t.done b::after{transform:scaleX(1)}
.t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.t .tx{flex:1;min-width:0}

/* people */
.stack{display:flex}.stack i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-style:normal;font-weight:600;color:#2a2440;border:2px solid var(--glass-solid);margin-left:-8px}
.stack i:first-child{margin-left:0}

/* timeline */
.tl{position:relative;height:262px;overflow:hidden}
.hours{display:grid;grid-template-columns:repeat(8,1fr);font-size:11.5px;color:var(--muted);padding-bottom:10px}
.hours span.now{color:var(--ink);font-weight:600}
.tl-body{position:absolute;inset:34px 18px 0;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12.5%)}
.bar{position:absolute;height:52px;border-radius:16px;padding:9px 14px;display:flex;align-items:center;gap:10px;transform-origin:left;
  animation:grow .9s var(--ease) both;animation-delay:calc(.5s + var(--i)*.14s)}
.bar .fill{position:absolute;inset:0;border-radius:16px;z-index:0}
.bar .ghost{position:absolute;left:100%;top:0;bottom:0;width:var(--ext);border-radius:0 16px 16px 0;opacity:.45;margin-left:-8px}
.bar>*{position:relative;z-index:1}
.bar b{font-size:13.5px;font-weight:500;display:block;white-space:nowrap}.bar small{font-size:11.5px;opacity:.65}
.bar .stack{margin-left:auto}
@keyframes grow{from{clip-path:inset(0 100% 0 0);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}
.nowline{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);opacity:.55;z-index:3}
.nowline::before{content:"";position:absolute;top:-4px;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.nowline::after{content:"";position:absolute;top:-8px;left:-7px;width:15px;height:15px;border-radius:50%;border:1px solid var(--ink);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:.8}to{transform:scale(1.7);opacity:0}}

/* ring + chart */
.ringwrap{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;height:100%;min-height:230px;position:relative}
.ringwrap svg{width:190px;height:190px;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring-bg{stroke:var(--line)}.ring-fg{stroke:url(#rg);stroke-dasharray:502;stroke-dashoffset:502;animation:ring 1.6s var(--ease) .6s forwards}
@keyframes ring{to{stroke-dashoffset:calc(502 - 502*var(--p))}}
.ringnum{position:absolute;top:50%;left:50%;transform:translate(-50%,-56%);text-align:center}
.ringnum strong{font-size:44px;font-weight:400;letter-spacing:-.05em;line-height:1}.ringnum small{display:block;color:var(--muted);font-size:12.5px}
.chart{position:relative;height:238px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-dasharray:3 5}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.chart .area{fill:url(#ag);opacity:0;animation:fade 1s ease 1.2s forwards}
.chart .pt{fill:var(--glass-solid);stroke:var(--ink);stroke-width:1.3;transition:r .25s var(--ease),fill .25s}
.chart .pt.act{fill:var(--lime);r:6}
.tip{position:absolute;top:0;left:0;padding:5px 10px;border-radius:10px;background:var(--dark);color:var(--on-dark);font-size:12px;pointer-events:none;
  transform:translate(-50%,-140%);transition:left .35s var(--ease),top .35s var(--ease)}
@keyframes fade{to{opacity:1}}

/* projects */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:4px}
.proj{padding:20px;border-radius:24px;background:var(--glass-solid);border:1px solid var(--line);transition:transform .5s var(--ease),box-shadow .5s;cursor:pointer}
.proj:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(60,50,110,.5)}
.proj .tag{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;margin-bottom:14px;color:var(--ink)}
.proj h4{font-size:18px;font-weight:600;letter-spacing:-.02em}
.proj p{color:var(--muted);font-size:13.5px;margin:6px 0 18px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:var(--lime);transition:width 1.3s var(--ease) .35s}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--muted)}
.row b{color:var(--ink);font-weight:500}
.filters{display:inline-flex;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);position:relative;margin-bottom:20px}
.filters button{position:relative;z-index:1;padding:9px 20px;border-radius:999px;font-size:14px;color:var(--muted);transition:color .3s}
.filters button.on{color:var(--on-dark)}
.filters .fp{position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;background:var(--dark);transition:transform .5s var(--ease),width .5s var(--ease)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}
.col{padding:12px;border-radius:26px;background:var(--glass);border:1px solid var(--line);min-height:300px}
.col h5{font-size:14px;font-weight:600;padding:6px 8px 12px;display:flex;justify-content:space-between}
.col h5 span{color:var(--muted);font-weight:400}
.k{padding:16px;border-radius:20px;background:var(--glass-solid);margin-bottom:10px;border:1px solid var(--line);transition:transform .4s var(--ease)}
.k:hover{transform:translateY(-3px) rotate(-.4deg)}
.k b{font-weight:500;font-size:14.5px;display:block;margin-bottom:12px}

/* list/rows */
.rows{display:flex;flex-direction:column;gap:10px;padding:4px}
.rw{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:22px;background:var(--glass-solid);border:1px solid var(--line);transition:transform .4s var(--ease)}
.rw:hover{transform:translateX(6px)}
.thumb{width:52px;height:52px;border-radius:16px;flex:none}
.rw .tx{flex:1}.rw b{font-weight:500}.rw small{display:block;color:var(--muted);font-size:13px}
.badge{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:6px}
.cal .dn{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.cd{min-height:84px;border-radius:18px;background:var(--glass-solid);padding:9px;font-size:13px;border:1px solid var(--line);transition:transform .3s var(--ease)}
.cd:hover{transform:scale(1.04)}.cd.today{background:var(--dark);color:var(--on-dark)}
.cd i{display:block;margin-top:6px;font-style:normal;font-size:11px;padding:3px 8px;border-radius:8px;color:var(--ink)}
/* bars */
.bars{display:flex;align-items:flex-end;gap:14px;height:230px;padding:10px 6px 0}
.bars div{flex:1;border-radius:14px 14px 6px 6px;background:var(--lav);height:0;position:relative;transition:height 1.2s var(--ease) calc(.3s + var(--i)*.07s)}
.bars div:nth-child(even){background:var(--lime)}
.bars span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted)}
.bars-w{padding-bottom:26px}

/* view transitions + entrance */
.view{display:none}.view.on{display:block}
.rv{opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i,0)*.075s + .05s)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}

/* modal */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,26,50,.3);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s}
.ov.show{opacity:1;pointer-events:auto}
.modal{width:min(440px,92vw);padding:30px;border-radius:34px;background:var(--glass-solid);border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(0,0,0,.5);
  transform:translateY(24px) scale(.94);transition:transform .55s var(--ease)}
.ov.show .modal{transform:none}
.modal h3{font-size:22px;margin-bottom:18px;letter-spacing:-.02em}
.modal label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.modal input,.modal select{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--glass);padding:0 16px;font:inherit;color:var(--ink);transition:box-shadow .3s,border-color .3s}
.modal input:focus,.modal select:focus{outline:0;border-color:var(--lav-deep);box-shadow:0 0 0 5px rgba(143,127,224,.2)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.ghost-b{padding:0 22px;height:50px;border-radius:999px;color:var(--muted)}
.toast{position:fixed;z-index:90;left:50%;bottom:28px;transform:translate(-50%,40px);padding:14px 22px;border-radius:999px;background:var(--dark);color:var(--on-dark);font-size:14px;opacity:0;transition:transform .6s var(--ease),opacity .4s}
.toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:1100px){.c5,.c7,.c4,.c8,.c3,.c6{grid-column:span 12}}
@media(max-width:860px){
  .main{padding:18px 16px 110px}
  .rail,.rail:hover{inset:auto 12px 12px 12px;width:auto;flex-direction:row;padding:8px;border-radius:26px;align-items:center}
  .logo,.rail-foot,.nav span,.pill{display:none}
  .nav{flex-direction:row;justify-content:space-around;gap:0}.nav button{height:44px;min-width:44px;justify-content:center}.nav button.on{background:var(--dark)}.nav svg{margin:0}
  .kan{grid-template-columns:repeat(4,240px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.rv{opacity:1;filter:none;transform:none}}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div>

<aside class="rail" aria-label="Navigasi utama">
  <div class="logo"><b><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M5 13c3-6 11-6 14 0M8 17c2-3 6-3 8 0"/></svg></b><em>Laporan<span>Wee</span></em></div>
  <nav class="nav" id="nav"><div class="pill" id="pill"></div></nav>
  <div class="rail-foot">
    <button id="logout" title="Keluar"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg><span>Keluar</span></button>
  </div>
</aside>

<main class="main">
  <div class="top">
    <div class="crumb" id="crumb">Dashboard</div>
    <div class="theme" role="group" aria-label="Tema">
      <div class="knob"></div>
      <button data-t="light" aria-label="Terang"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-t="dark" aria-label="Gelap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </div>
    <button class="round" aria-label="Cari"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="avatar">AD</div>
  </div>
  <div id="views"></div>
</main>

<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Buat Laporan">
  <h3>Buat Laporan</h3>
  <label for="f1">Judul laporan</label><input id="f1" placeholder="Contoh: Progres desain minggu ini">
  <label for="f2">Proyek</label><select id="f2"><option>Rebranding Kopi Nusa</option><option>Kampanye Ramadan</option><option>Website Studio Kaya</option></select>
  <div class="acts"><button class="ghost-b" id="cancel">Batal</button><button class="cta" id="save">Simpan laporan</button></div>
</div></div>
<div class="toast" id="toast">Laporan disimpan</div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const IC={
 home:'<path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 doc:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/>',
 task:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
 share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4.5 4.5L19 7"/>'
};
const ico=(n,sw=1.8)=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const NAV=[['dashboard','Dashboard','home'],['proyek','Proyek','folder'],['laporan','Laporan','doc'],['tugas','Tugas','task'],['sosial','Sosial Media','share'],['tim','Tim','users'],['kalender','Kalender','cal'],['analitik','Analitik','chart']];
const P=[['Rina','#e3ddfa'],['Dimas','#e9f5b8'],['Sari','#f6e6cf'],['Bayu','#d6ecdf'],['Tika','#f1d8e4'],['Arga','#d9d3f5']];
const ppl=(n,off=0)=>`<div class="stack">${P.slice(off,off+n).map(p=>`<i style="background:${p[1]}">${p[0][0]}${p[0][1]}</i>`).join('')}</div>`;
const rv=i=>`rv" style="--i:${i}`;

const PROJ=[
 ['Rebranding Kopi Nusa','Identitas visual dan kemasan','On-Track',78,'var(--lime-soft)',3],
 ['Kampanye Ramadan','Konten sosial media 30 hari','On-Track',62,'var(--lav)',4],
 ['Website Studio Kaya','Desain dan pengembangan landing page','Berisiko',34,'var(--peach)',2],
 ['Video Profil Perusahaan','Naskah, syuting, dan penyuntingan','On-Track',91,'var(--mint)',3],
 ['Katalog Produk 2026','Layout cetak dan digital','Berisiko',48,'var(--pink)',2],
 ['Event Launching Q4','Dekorasi, rundown, dan publikasi','On-Track',55,'var(--lav)',5]];

const V={};
V.dashboard=()=>`
<div class="head"><div class="grow ${rv(0)}"><h1>Selamat pagi, Admin!</h1><p>Mari buat hari ini produktif.</p></div>
 <div class="kpi ${rv(1)}"><small>Proyek Aktif</small><strong data-count="12">0</strong></div>
 <div class="kpi ${rv(2)}"><small>Tugas Berjalan</small><strong data-count="48">0</strong></div>
 <div class="kpi ${rv(3)}"><small>Tingkat Selesai</small><strong data-count="82">0</strong><sup>%</sup></div>
 <button class="cta ${rv(4)}" data-open>${ico('plus',2.2)}Buat Laporan</button></div>
<div class="grid">
 <section class="card c5 ${rv(3)}"><div class="card-h"><div><h3>Tugas Berjalan</h3><div class="sub">Rabu, 11 Mei</div></div></div>
  <div class="todo" style="padding:0 4px 4px">
   ${[['Review & umpan balik klien','Redesain landing page','22.00 – 23.45',1,1],['Susun laporan mingguan','Divisi Kreatif','10.00 – 11.00',0,0],['Revisi kemasan Kopi Nusa','Rebranding','13.30 – 15.00',0,2],['Rapat sinkronisasi tim','Google Meet','16.00 – 16.30',0,3]].map(t=>`
   <div class="t ${t[3]?'done':''}" tabindex="0" role="checkbox" aria-checked="${!!t[3]}"><span class="chk">${ico('check',3)}</span><div class="tx"><b>${t[0]}</b><small>${t[1]} · ${t[2]}</small></div>${ppl(2,t[4])}</div>`).join('')}
  </div></section>
 <section class="card c7 ${rv(4)}"><div class="card-h"><div><h3>Aktivitas Hari Ini</h3><div class="sub">Yang menunggu Anda hari ini</div></div></div>
  <div class="inner tl"><div class="hours">${['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00'].map(h=>`<span class="${h=='12:00'?'now':''}">${h}</span>`).join('')}</div>
   <div class="tl-body">
    ${[['Onboarding proyek','Google Meet',0,32,'var(--lime)','#2a3308',6,0,2],['Riset desain','Figma',20,30,'#d6d3dc','#2a2733',5,1,3],['Istirahat kopi','CoCo Café',56,22,'#c9bff0','#2a2440',0,2,1]].map((b,i)=>`
    <div class="bar" style="--i:${b[7]};left:${b[2]}%;width:${b[3]}%;top:${i*60+6}px;color:${b[5]}"><span class="fill" style="background:${b[4]}"></span><span class="ghost" style="--ext:${b[3]*.5}%;background:${b[4]}"></span>
     <div><b>${b[0]}</b><small>${b[1]}</small></div>${b[6]?ppl(2,b[8]):''}</div>`).join('')}
    <div class="nowline" style="left:62.5%"></div></div></div></section>
 <section class="card c4 ${rv(5)}"><div class="card-h"><div><h3>Tingkat Selesai</h3><div class="sub">Capaian deliverable minggu ini</div></div></div>
  <div class="inner ringwrap"><svg viewBox="0 0 180 180"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2e04a"/><stop offset="1" stop-color="#8f7fe0"/></linearGradient></defs>
   <circle class="ring-bg" cx="90" cy="90" r="80"/><circle class="ring-fg" cx="90" cy="90" r="80" style="--p:.82"/></svg>
   <div class="ringnum"><strong data-count="82">0</strong><strong>%</strong><small>Selesai</small></div></div></section>
 <section class="card c8 ${rv(6)}"><div class="card-h"><div><h3>Kemajuan Divisi</h3><div class="sub">Pantau performa tim</div></div></div>
  <div class="inner"><div class="chart" id="chart"></div></div></section>
 <section class="card c12 ${rv(7)}"><div class="card-h"><div><h3>Pekerjaan &amp; Proyek Terkini</h3><div class="sub">Klik kartu untuk membuka proyek</div></div></div>
  <div class="projs">${PROJ.slice(0,3).map(projCard).join('')}</div></section>
</div>`;

function projCard(p){return `<article class="proj" tabindex="0"><span class="tag" style="background:${p[4]}">${p[2]}</span><h4>${p[0]}</h4><p>${p[1]}</p>
 <div class="prog"><i data-w="${p[3]}"></i></div><div class="row"><span>${ppl(p[5])}</span><b>${p[3]}%</b></div></article>`}

V.proyek=()=>`<div class="head"><div class="grow ${rv(0)}"><h1>Proyek</h1><p>Semua pekerjaan kreatif tim dalam satu tempat.</p></div><button class="cta ${rv(1)}" data-open>${ico('plus',2.2)}Buat Laporan</button></div>
 <div class="filters ${rv(1)}" id="flt"><div class="fp"></div>${['Semua','On-Track','Berisiko'].map((f,i)=>`<button class="${i?'':'on'}" data-f="${f}">${f}</button>`).join('')}</div>
 <div class="card ${rv(2)}"><div class="projs" id="pj">${PROJ.map(projCard).join('')}</div></div>`;

V.tugas=()=>`<div class="head"><div class="grow ${rv(0)}"><h1>Tugas</h1><p>Seret prioritas Anda dari rencana sampai selesai.</p></div></div>
 <div class="kan">${[['To Do',['Brief kampanye Ramadan','Moodboard kemasan']],['Sedang Dikerjakan',['Desain landing page','Naskah video profil','Layout katalog']],['Dalam Review',['Logo Kopi Nusa']],['Selesai',['Rundown event','Kontrak vendor']]].map((c,i)=>`
 <div class="col ${rv(i+1)}"><h5>${c[0]}<span>${c[1].length}</span></h5>${c[1].map((t,j)=>`<div class="k"><b>${t}</b><div class="row" style="margin:0">${ppl(2,(i+j)%4)}<span>${10+i*3+j} Mei</span></div></div>`).join('')}</div>`).join('')}</div>`;

V.laporan=()=>`<div class="head"><div class="grow ${rv(0)}"><h1>Laporan</h1><p>Catatan progres harian seluruh tim.</p></div><button class="cta ${rv(1)}" data-open>${ico('plus',2.2)}Buat Laporan</button></div>
 <div class="card ${rv(2)}"><div class="rows">${[['Progres desain landing page','Rina · 11 Mei','Terkirim','var(--lime-soft)','var(--lav)'],['Revisi kemasan tahap 2','Dimas · 10 Mei','Direview','var(--lav)','var(--peach)'],['Syuting video profil hari ke-3','Sari · 09 Mei','Terkirim','var(--lime-soft)','var(--mint)'],['Rekap konten sosial media','Bayu · 08 Mei','Draf','var(--peach)','var(--pink)'],['Evaluasi event launching','Tika · 07 Mei','Terkirim','var(--lime-soft)','var(--lav)']].map(r=>`
 <div class="rw"><div class="thumb" style="background:linear-gradient(135deg,${r[4]},${r[3]})"></div><div class="tx"><b>${r[0]}</b><small>${r[1]}</small></div><span class="badge" style="background:${r[3]}">${r[2]}</span></div>`).join('')}</div></div>`;

V.sosial=()=>`<div class="head"><div class="grow ${rv(0)}"><h1>Sosial Media</h1><p>Performa konten di semua kanal.</p></div></div>
 <div class="grid">${[['Instagram','24,8 rb','Pengikut','+3,2%','var(--pink)'],['TikTok','61,4 rb','Penayangan','+12%','var(--lav)'],['YouTube','8,1 rb','Pelanggan','+1,4%','var(--peach)'],['LinkedIn','5,6 rb','Pengikut','+2,1%','var(--mint)']].map((s,i)=>`
 <section class="card c3 ${rv(i+1)}"><div class="inner" style="background:${s[4]};color:var(--ink)"><small>${s[0]}</small><div class="kpi" style="margin-top:22px"><strong>${s[1]}</strong><small style="color:var(--ink);opacity:.65;margin-top:6px">${s[2]} · ${s[3]}</small></div></div></section>`).join('')}</div>`;

V.tim=()=>`<div class="head"><div class="grow ${rv(0)}"><h1>Tim</h1><p>Anggota dan beban kerja minggu ini.</p></div></div>
 <div class="grid">${P.map((p,i)=>`<section class="card c4 ${rv(i+1)}"><div class="inner" style="display:flex;align-items:center;gap:16px"><div class="avatar" style="width:58px;height:58px;background:${p[1]};font-size:18px">${p[0].slice(0,2)}</div>
 <div style="flex:1"><b style="font-weight:600">${p[0]}</b><div class="sub" style="color:var(--muted);font-size:13px">${['Art Director','Desainer','Videografer','Copywriter','Social Media','Developer'][i]}</div><div class="prog" style="margin-top:12px"><i data-w="${[82,64,91,55,73,48][i]}"></i></div></div></div></section>`).join('')}</div>`;

V.kalender=()=>{const ev={3:['Rapat tim','var(--lav)'],7:['Deadline logo','var(--peach)'],11:['Hari ini · Review','var(--lime)'],14:['Syuting','var(--mint)'],19:['Launching','var(--pink)'],24:['Evaluasi','var(--lav)']};
 return `<div class="head"><div class="grow ${rv(0)}"><h1>Kalender</h1><p>Mei 2026</p></div></div><div class="card ${rv(1)}"><div class="cal">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dn">${d}</div>`).join('')}
 ${Array.from({length:31},(_,i)=>`<div class="cd ${i+1==11?'today':''}">${i+1}${ev[i+1]?`<i style="background:${ev[i+1][1]}">${ev[i+1][0]}</i>`:''}</div>`).join('')}</div></div>`};

V.analitik=()=>`<div class="head"><div class="grow ${rv(0)}"><h1>Analitik</h1><p>Produktivitas tim 8 minggu terakhir.</p></div></div>
 <div class="card ${rv(1)}"><div class="inner bars-w"><div class="bars" id="bars">${[42,55,48,70,63,82,76,90].map((v,i)=>`<div style="--i:${i}" data-h="${v}"><span>M${i+1}</span></div>`).join('')}</div></div></div>`;

/* ---------- engine ---------- */
const nav=$('#nav'),pill=$('#pill'),views=$('#views');let cur='dashboard';
NAV.forEach(n=>{const b=document.createElement('button');b.dataset.v=n[0];b.innerHTML=ico(n[2])+`<span>${n[1]}</span>`;nav.appendChild(b)});
function go(v){cur=v;
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const i=NAV.findIndex(n=>n[0]===v);pill.style.transform=`translateY(${i*54}px)`;
  $('#crumb').textContent=NAV[i][1];
  views.innerHTML=`<div class="view on">${V[v]()}</div>`;scrollTo({top:0,behavior:'smooth'});init();}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});

function init(){
  $$('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now()+500;
    (function f(t){const p=Math.min(Math.max((t-t0)/1400,0),1),e=1-Math.pow(1-p,4);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f)})(t0)});
  requestAnimationFrame(()=>setTimeout(()=>{$$('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');$$('[data-h]').forEach(e=>e.style.height=e.dataset.h+'%')},60));
  $$('.t').forEach(t=>{const tg=()=>{t.classList.toggle('done');t.setAttribute('aria-checked',t.classList.contains('done'))};t.onclick=tg;t.onkeydown=e=>{if(e.key==' '||e.key=='Enter'){e.preventDefault();tg()}}});
  $$('[data-open]').forEach(b=>b.onclick=()=>$('#ov').classList.add('show'));
  const fl=$('#flt');if(fl){const mv=b=>{const p=$('.fp',fl);p.style.width=b.offsetWidth+'px';p.style.transform=`translateX(${b.offsetLeft-5}px)`};
    mv($('button.on',fl));fl.onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('button',fl).forEach(x=>x.classList.toggle('on',x===b));mv(b);
      $$('#pj .proj').forEach((c,i)=>{const ok=b.dataset.f=='Semua'||PROJ[i][2]==b.dataset.f;c.style.display=ok?'':'none'})}}
  if($('#chart'))chart();
}
function chart(){
  const el=$('#chart'),W=760,H=238,pad=30,d=[210,330,250,300,390,280,340,260,300,380,330,430],mx=450,
  X=i=>pad+i*(W-pad*2)/(d.length-1),Y=v=>H-24-(v/mx)*(H-50);
  const pts=d.map((v,i)=>[X(i),Y(v)]);let p=`M${pts[0]}`;
  for(let i=0;i<pts.length-1;i++){const a=pts[i-1]||pts[i],b=pts[i],c=pts[i+1],e=pts[i+2]||c;
    p+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f7fe0" stop-opacity=".28"/><stop offset="1" stop-color="#8f7fe0" stop-opacity="0"/></linearGradient></defs>
  ${[0,100,200,300,400].map(v=>`<line class="grid-l" x1="${pad}" x2="${W-pad}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="0" y="${Y(v)+4}">${v}</text>`).join('')}
  <path class="area" d="${p}L${pts.at(-1)[0]},${H-24}L${pts[0][0]},${H-24}Z"/><path class="ln" id="ln" d="${p}"/>
  ${pts.map((q,i)=>`<circle class="pt" data-i="${i}" cx="${q[0]}" cy="${q[1]}" r="4" style="opacity:0;transition:opacity .4s ${1.2+i*.05}s,r .25s,fill .25s"/>`).join('')}</svg><div class="tip" id="tip">${d[4]}</div>`;
  const ln=$('#ln'),L=ln.getTotalLength();ln.style.cssText=`stroke-dasharray:${L};stroke-dashoffset:${L};transition:stroke-dashoffset 2s cubic-bezier(.22,1,.36,1) .5s`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ln.style.strokeDashoffset=0;$$('.pt',el).forEach(c=>c.style.opacity=1)}));
  const tip=$('#tip'),sv=$('svg',el);
  const show=i=>{$$('.pt',el).forEach((c,k)=>c.classList.toggle('act',k==i));const r=el.getBoundingClientRect();tip.textContent=d[i];tip.style.left=pts[i][0]/W*r.width+'px';tip.style.top=pts[i][1]/H*r.height+'px'};
  setTimeout(()=>show(4),1500);
  el.onmousemove=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;let b=0;pts.forEach((q,i)=>{if(Math.abs(q[0]-x)<Math.abs(pts[b][0]-x))b=i});show(b)};
}
/* theme */
$$('.theme button').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.t});
/* modal + toast */
const ov=$('#ov'),toast=$('#toast');
const close=()=>ov.classList.remove('show');
$('#cancel').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};addEventListener('keydown',e=>{if(e.key=='Escape')close()});
$('#save').onclick=()=>{close();toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)};
go('dashboard');
</script>
</body>
</html>
